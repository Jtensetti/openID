limit_req_zone $binary_remote_addr zone=openid_beta:1m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=openid_conn:1m;
server {
 listen 80 default_server;
 server_name _;
 access_log off;
 error_log /var/log/nginx/openid-error.log crit;
 location ^~ /.well-known/acme-challenge/ { root /var/www/openid-acme; }
 location / { return 404; }
}
server {
 listen 443 ssl default_server;
 server_name _;
 ssl_reject_handshake on;
}
server {
 listen 443 ssl;
 server_name openid.tensetti.io;
 # Apply transport policy to static files, upstream replies and gateway errors.
 proxy_hide_header Strict-Transport-Security;
 add_header Strict-Transport-Security "max-age=31536000" always;
 ssl_certificate /etc/letsencrypt/live/openid-beta/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/openid-beta/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 access_log off;
 error_log /var/log/nginx/openid-error.log crit;
 client_max_body_size 128k;
 # Keep bounded SAML POSTs in memory, including encrypted identity attributes.
 client_body_buffer_size 128k;
 client_body_timeout 15s;
 limit_conn openid_conn 10;
 limit_req zone=openid_beta burst=40 nodelay;
 add_header Cache-Control "no-store" always;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin always;
 add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:; form-action 'self' https://idp.openid.tensetti.io; frame-ancestors 'none'; base-uri 'none'" always;
 root /var/www/openid-beta;
 location = / { try_files /index.html =404; }
 location = /beta.css { try_files /beta.css =404; }
 # Public TestFlight flows. The SP enforces identity sessions and report ownership.
 location ~ "^/(login|acs|me|portrait|logout|style\.css|console\.css|sign|sign/acs|test|test/(acs|ca\.pem|metadata/(sp|sign)\.xml|run/[a-z0-9-]{1,32}|report/[A-Za-z0-9_-]{22}(/(signed\.pdf|document\.pdf|evidence\.json))?)|oidc/(login|callback|me|logout))$" {
  auth_basic off;
  proxy_pass https://127.0.0.1:9444;
  proxy_ssl_verify on;
  proxy_ssl_trusted_certificate /etc/nginx/openid-saml.crt;
  proxy_ssl_name localhost;
  proxy_set_header Host openid.tensetti.io;
  proxy_set_header Forwarded "";
  proxy_set_header X-Forwarded-Host "";
  proxy_set_header X-Forwarded-For "";
  proxy_set_header Authorization "";
  # Encrypted SignMessage produces a signed Location header larger than 4 KiB.
  proxy_buffer_size 16k;
  proxy_buffers 4 16k;
  proxy_buffering off;
  proxy_next_upstream off;
 }
 location / { return 404; }
}
server {
 listen 443 ssl;
 server_name idp.openid.tensetti.io;
 proxy_hide_header Strict-Transport-Security;
 add_header Strict-Transport-Security "max-age=31536000" always;
 ssl_certificate /etc/letsencrypt/live/openid-beta/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/openid-beta/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 access_log off;
 error_log /var/log/nginx/openid-error.log crit;
 client_max_body_size 128k;
 client_body_buffer_size 128k;
 limit_conn openid_conn 10;
 limit_req zone=openid_beta burst=40 nodelay;
 # Public protocol/browser endpoints still require signed requests and app approval.
 auth_basic off;
 location ~ ^/(lab|wallet|actuator|health)(/|$) { return 404; }
 location = /oidc/token {
  auth_basic off;
  limit_except POST { deny all; }
  proxy_pass https://127.0.0.1:9443;
  proxy_ssl_verify on;
  proxy_ssl_trusted_certificate /etc/nginx/openid-saml.crt;
  proxy_ssl_name localhost;
  proxy_set_header Host idp.openid.tensetti.io;
  proxy_set_header Forwarded "";
  proxy_set_header X-Forwarded-Host "";
  proxy_set_header X-Forwarded-For "";
  proxy_set_header Authorization "";
  proxy_buffering off;
  proxy_next_upstream off;
 }

 location / {
  proxy_pass https://127.0.0.1:9443;
  proxy_ssl_verify on;
  proxy_ssl_trusted_certificate /etc/nginx/openid-saml.crt;
  proxy_ssl_name localhost;
  proxy_set_header Host idp.openid.tensetti.io;
  proxy_set_header Forwarded "";
  proxy_set_header X-Forwarded-Host "";
  proxy_set_header X-Forwarded-For "";
  proxy_set_header Authorization "";
  proxy_buffering off;
  proxy_next_upstream off;
 }
}
server {
 listen 443 ssl;
 server_name api.openid.tensetti.io;
 proxy_hide_header Strict-Transport-Security;
 add_header Strict-Transport-Security "max-age=31536000" always;
 ssl_certificate /etc/letsencrypt/live/openid-beta/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/openid-beta/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 access_log off;
 error_log /var/log/nginx/openid-error.log crit;
 client_max_body_size 11m;
 client_body_timeout 15s;
 client_body_buffer_size 12m;
 limit_conn openid_conn 10;
 limit_req zone=openid_beta burst=160 nodelay;
 location ~ ^/(native/(notice|start|attest|consent|chip/start|chip/step|cancel|finish|withdraw)|wallet/(challenge|execute))$ {
  limit_except POST { deny all; }
  proxy_pass https://127.0.0.1:8767;
  proxy_ssl_verify on;
  proxy_ssl_trusted_certificate /etc/nginx/openid-api.crt;
  proxy_ssl_name localhost;
  proxy_set_header Host api.openid.tensetti.io;
  # Replace any client-supplied value; only the loopback runtime trusts this.
  # Deploy together with runtime.json trustedProxy=127.0.0.1.
  proxy_set_header X-OpenID-Client-IP $remote_addr;
  proxy_set_header Forwarded "";
  proxy_set_header X-Forwarded-Host "";
  proxy_set_header X-Forwarded-For "";
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_read_timeout 120s;
  proxy_next_upstream off;
 }
 location / { return 404; }
}
