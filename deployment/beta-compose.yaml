name: openid-beta
x-service: &service
  image: ${OPENID_BETA_IMAGE_ID:?Set OPENID_BETA_IMAGE_ID to the verified sha256 image ID}
  network_mode: host
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true
  restart: unless-stopped
  pids_limit: 128
  tmpfs: ["/tmp:size=128m,mode=1777"]
  logging:
    driver: json-file
    options: {max-size: 5m, max-file: "2"}
services:
  verifier:
    <<: *service
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 70s
    volumes:
      - ./probe.py:/app/verification/probe.py:ro
      - ${OPENID_BETA_DIRECTORY:?Set OPENID_BETA_DIRECTORY}/runtime.json:/srv/openid/runtime.json:ro
      - ${OPENID_BETA_DIRECTORY}/secrets:/srv/openid/secrets:ro
      - ${OPENID_BETA_DIRECTORY}/data:/srv/openid/data
  bridge:
    <<: *service
    mem_limit: 128m
    cpus: 0.5
    healthcheck: {disable: true}
    entrypoint: [python, /app/verification/saml_bridge.py]
    environment: {OPENID_PILOT_ORIGINS: /srv/openid/origins.json}
    volumes:
      - ${OPENID_BETA_DIRECTORY}/data:/srv/openid/data
      - ${OPENID_BETA_DIRECTORY}/origins.json:/srv/openid/origins.json:ro
      - ../verification/federation.py:/app/verification/federation.py:ro
      - ./saml_bridge.py:/app/verification/saml_bridge.py:ro
  idp:
    <<: *service
    mem_limit: 640m
    cpus: 1
    healthcheck: {disable: true}
    entrypoint: [java, -Xmx384m, -jar, /app/prototype/target/isolated-eid-lab.jar]
    command: [phone-idp, /srv/openid/federation, /srv/openid/data/federation.sock, /srv/openid/origins.json]
    volumes:
      - ${OPENID_BETA_DIRECTORY}/data:/srv/openid/data
      - ${OPENID_BETA_DIRECTORY}/federation:/srv/openid/federation
      - ${OPENID_BETA_DIRECTORY}/origins.json:/srv/openid/origins.json:ro
  sp:
    <<: *service
    mem_limit: 384m
    cpus: 0.5
    healthcheck: {disable: true}
    entrypoint: [java, -Xmx192m, -jar, /app/prototype/target/isolated-eid-lab.jar]
    command: [phone-sp, /srv/openid/federation, /srv/openid/data/federation.sock, /srv/openid/origins.json]
    volumes:
      - ${OPENID_BETA_DIRECTORY}/data:/srv/openid/data
      - ${OPENID_BETA_DIRECTORY}/federation:/srv/openid/federation:ro
      - ${OPENID_BETA_DIRECTORY}/origins.json:/srv/openid/origins.json:ro
