name: tjipp
x-service: &service
  image: ${TJIPP_IMAGE_ID:?Set TJIPP_IMAGE_ID to the verified sha256 image ID}
  pull_policy: never
  platform: linux/amd64
  network_mode: host
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true
  restart: unless-stopped
  pids_limit: 128
  tmpfs: ["/tmp:size=128m,mode=1777"]
  logging:
    driver: json-file
    options: {max-size: 5m, max-file: "2"}
services:
  vault:
    <<: *service
    user: "10005:20002"
    mem_limit: 128m
    cpus: 0.5
    entrypoint: [python, /app/verification/vault_service.py]
    environment:
      OPENID_VAULT_KEY: /srv/openid/keys/wallet.identity-key
      OPENID_VAULT_SOCKET: /srv/openid/vault-ipc/vault.sock
    volumes:
      - ${TJIPP_DIRECTORY:?Set TJIPP_DIRECTORY}/vault/private:/srv/openid/keys:ro
      - ${TJIPP_DIRECTORY}/vault/socket:/srv/openid/vault-ipc
    healthcheck:
      test: ["CMD", "python", "/app/verification/vault_service.py", "--probe"]
      interval: 3s
      timeout: 2s
      retries: 15
      start_period: 5s
  verifier:
    <<: *service
    user: "10001:20002"
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 70s
    depends_on:
      vault: {condition: service_healthy}
    environment:
      OPENID_CONTINUITY_CONFIG: /srv/openid/continuity.json
      OPENID_IDENTITY_VAULT_SOCKET: /srv/openid/vault-ipc/vault.sock
    volumes:
      - ${TJIPP_DIRECTORY:?Set TJIPP_DIRECTORY}/runtime.json:/srv/openid/runtime.json:ro
      - ${TJIPP_DIRECTORY}/secrets:/srv/openid/secrets:ro
      - ${TJIPP_DIRECTORY}/data:/srv/openid/data
      - ${TJIPP_DIRECTORY}/continuity.json:/srv/openid/continuity.json:ro
      - ${TJIPP_DIRECTORY}/vault/socket:/srv/openid/vault-ipc:ro
  bridge:
    <<: *service
    user: "10001:20001"
    group_add: ["20002", "20003"]
    mem_limit: 128m
    cpus: 0.5
    healthcheck: {disable: true}
    depends_on:
      vault: {condition: service_healthy}
    entrypoint: [python, /app/verification/saml_bridge.py]
    environment:
      OPENID_CONTINUITY_CONFIG: /srv/openid/continuity.json
      OPENID_PILOT_ORIGINS: /srv/openid/origins.json
      OPENID_FEDERATION_CONFIG: /srv/openid/federation.json
      OPENID_IDENTITY_VAULT_SOCKET: /srv/openid/vault-ipc/vault.sock
      OPENID_FEDERATION_SOCKET: /srv/openid/federation-ipc/federation.sock
      OPENID_FEDERATION_GROUP: "20001"
      OPENID_NOTICE_SOCKET: /srv/openid/notice-ipc/notice.sock
      OPENID_NOTICE_GROUP: "20003"
    volumes:
      - ${TJIPP_DIRECTORY:?Set TJIPP_DIRECTORY}/data:/srv/openid/data
      - ${TJIPP_DIRECTORY}/continuity.json:/srv/openid/continuity.json:ro
      - ${TJIPP_DIRECTORY}/origins.json:/srv/openid/origins.json:ro
      - ${TJIPP_DIRECTORY}/federation.json:/srv/openid/federation.json:ro
      - ${TJIPP_DIRECTORY}/ipc/federation:/srv/openid/federation-ipc
      - ${TJIPP_DIRECTORY}/ipc/notice:/srv/openid/notice-ipc
      - ${TJIPP_DIRECTORY}/vault/socket:/srv/openid/vault-ipc:ro
  idp:
    <<: *service
    user: "10002:20001"
    mem_limit: 640m
    cpus: 1
    healthcheck: {disable: true}
    entrypoint: [java, -Xmx384m, -jar, /app/prototype/target/isolated-eid-lab.jar]
    command: [runtime-idp, /srv/openid/federation, /srv/openid/federation-ipc/federation.sock, /srv/openid/origins.json, /srv/openid/federation.json, /srv/openid/federation-state]
    volumes:
      - ${TJIPP_DIRECTORY:?Set TJIPP_DIRECTORY}/federation-idp:/srv/openid/federation:ro
      - ${TJIPP_DIRECTORY}/ipc/federation:/srv/openid/federation-ipc:ro
      - ${TJIPP_DIRECTORY}/origins.json:/srv/openid/origins.json:ro
      - ${TJIPP_DIRECTORY}/federation.json:/srv/openid/federation.json:ro
      - ${TJIPP_DIRECTORY}/federation-state:/srv/openid/federation-state
  sp:
    <<: *service
    user: "10003:20001"
    mem_limit: 384m
    cpus: 0.5
    healthcheck: {disable: true}
    entrypoint: [java, -Xmx192m, -jar, /app/prototype/target/isolated-eid-lab.jar]
    command: [runtime-sp, /srv/openid/federation, /srv/openid/federation-ipc/federation.sock, /srv/openid/origins.json, /srv/openid/federation.json]
    volumes:
      - ${TJIPP_DIRECTORY:?Set TJIPP_DIRECTORY}/federation-sp:/srv/openid/federation:ro
      - ${TJIPP_DIRECTORY}/ipc/federation:/srv/openid/federation-ipc:ro
      - ${TJIPP_DIRECTORY}/origins.json:/srv/openid/origins.json:ro
      - ${TJIPP_DIRECTORY}/federation.json:/srv/openid/federation.json:ro
  notice-exporter:
    <<: *service
    user: "10004:20003"
    mem_limit: 128m
    cpus: 0.25
    stop_grace_period: 70s
    healthcheck: {disable: true}
    depends_on:
      bridge: {condition: service_started}
    entrypoint: [python, /app/verification/notice_exporter.py]
    environment:
      OPENID_NOTICE_SOCKET: /srv/openid/notice-ipc/notice.sock
      OPENID_NOTICE_QUEUE_URL: ${TJIPP_NOTICE_QUEUE_URL:?Set TJIPP_NOTICE_QUEUE_URL}
    volumes:
      - ${TJIPP_DIRECTORY:?Set TJIPP_DIRECTORY}/ipc/notice:/srv/openid/notice-ipc:ro
