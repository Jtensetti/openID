# Render terminates public TLS; this container receives HTTP only on $PORT.
# The upstream IdP remains TLS-only and loopback-bound. No real credentials.
worker_processes 1;
pid /tmp/tjipp-sandbox-nginx.pid;
error_log /dev/stderr warn;
events {
    worker_connections 128;
}
http {
    access_log off;
    server_tokens off;
    # nginx initializes these paths even when a protocol module is unused.
    # Keep every temporary file inside the directory owned by UID 10001.
    client_body_temp_path /tmp/tjipp-sandbox/client_body;
    proxy_temp_path /tmp/tjipp-sandbox/proxy;
    fastcgi_temp_path /tmp/tjipp-sandbox/fastcgi;
    uwsgi_temp_path /tmp/tjipp-sandbox/uwsgi;
    scgi_temp_path /tmp/tjipp-sandbox/scgi;
    client_max_body_size 128k;
    client_body_timeout 15s;
    send_timeout 15s;
    proxy_read_timeout 30s;
    limit_req_zone $binary_remote_addr zone=tjipp_sandbox:1m rate=6r/s;
    server {
        listen 0.0.0.0:@PORT@;
        server_name tjipp-sweden-connect-sandbox.onrender.com;
        default_type text/plain;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location = /healthz {
            add_header Cache-Control "no-store" always;
            return 200 "Synthetic Tjipp Sandbox ingress\n";
        }
        location = /robots.txt {
            return 200 "User-agent: *\nDisallow: /\n";
        }
        location = /logo.svg {
            alias /app/logo.svg;
            default_type image/svg+xml;
            add_header Cache-Control "public,max-age=3600";
        }
        location = / {
            return 404;
        }
        location ~ ^/(wallet|phone|actuator|health)(/|$) {
            return 404;
        }
        location = /lab/revoke {
            return 404;
        }
        location / {
            limit_req zone=tjipp_sandbox burst=20 nodelay;
            proxy_pass https://127.0.0.1:9443;
            proxy_http_version 1.1;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /srv/tjipp-sandbox/keys/tls.crt;
            proxy_ssl_verify_depth 1;
            proxy_ssl_name localhost;
            proxy_ssl_server_name on;
            proxy_set_header Host tjipp-sweden-connect-sandbox.onrender.com;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-OpenID-Client-IP "";
            proxy_set_header Authorization "";
            proxy_next_upstream off;
            proxy_buffering off;
            proxy_redirect off;
        }
    }
}
