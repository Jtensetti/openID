# EXAMPLE ONLY: standalone synthetic-only IdP, never load this into the private phone pilot.
# Requires: dedicated DNS, public TLS certificate, distinct service and OS account.
# Copy an approved SVG logo to /var/www/tjipp-sandbox/logo.svg.
limit_req_zone $binary_remote_addr zone=tjipp_sandbox:1m rate=5r/s;
server {
  listen 443 ssl;
  server_name idp-sandbox.tensetti.io;
  ssl_certificate /etc/letsencrypt/live/idp-sandbox.tensetti.io/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/idp-sandbox.tensetti.io/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 128k;
  client_body_timeout 15s;
  access_log off;
  error_log /var/log/nginx/tjipp-sandbox-error.log warn;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin always;
  limit_req zone=tjipp_sandbox burst=20 nodelay;

  location = /logo.svg {
    alias /var/www/tjipp-sandbox/logo.svg;
    default_type image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
  }
  location ~ ^/(wallet|phone|actuator|health)(/|$) { return 404; }
  location = /lab/revoke { return 404; }

  # Public metadata and SAML/OIDC endpoints MUST NOT have HTTP Basic Auth.
  # This instance may authenticate ONLY the synthetic, disposable test credential.
  location / {
    proxy_pass https://127.0.0.1:9443;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /srv/tjipp-sandbox/keys/tls.crt;
    proxy_ssl_name localhost;
    proxy_ssl_server_name on;
    proxy_set_header Host idp-sandbox.tensetti.io;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-OpenID-Client-IP "";
    proxy_buffering off;
    proxy_next_upstream off;
  }
}
