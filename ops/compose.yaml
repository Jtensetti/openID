services:
  sealed-production:
    build: .
    image: openid-sealed:local
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 192m
    cpus: 0.5
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777"]
    networks: [sealed]
networks:
  sealed:
    internal: true
