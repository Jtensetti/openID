name: iPhone capture build
on:
  push:
    branches: ['feat/**', main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record compiler and resolve locked Swift dependencies
        run: |
          python3 ios/scripts/project.py
          git diff --exit-code -- ios/PassportCapture.xcodeproj
          xcodebuild -version
          xcodebuild -resolvePackageDependencies -project ios/PassportCapture.xcodeproj -scheme PassportCapture -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" -onlyUsePackageVersionsFromResolvedFile
          git diff --exit-code -- ios/PassportCapture.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Build actual iOS target without signing or deploying
        run: xcodebuild -project ios/PassportCapture.xcodeproj -scheme PassportCapture -configuration Release -destination 'generic/platform=iOS' -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" -derivedDataPath "$RUNNER_TEMP/ios-build" -disableAutomaticPackageResolution CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Verify CryptoKit signatures with the actual server verifier
        run: swift ios/scripts/crypto-interop.swift | node verification/device-signature.mjs
      - name: Boot iPhone simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl create 'openID CI iPhone' com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro com.apple.CoreSimulator.SimRuntime.iOS-18-5)
          printf 'SIMULATOR_ID=%s\n' "$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Test signing boundaries and actual SwiftUI screens
        run: xcodebuild -project ios/PassportCapture.xcodeproj -scheme PassportCapture -configuration Debug -destination "id=$SIMULATOR_ID" -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" -derivedDataPath "$RUNNER_TEMP/ios-simulator" -resultBundlePath "$RUNNER_TEMP/ios-evidence/Tests.xcresult" -disableAutomaticPackageResolution -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test
      - name: Capture actual app screenshot
        run: |
          xcrun simctl status_bar "$SIMULATOR_ID" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          # Start on the real first-launch home, independent of the last UI test's navigation.
          xcrun simctl terminate "$SIMULATOR_ID" se.openid.PassportCapture || true
          xcrun simctl launch "$SIMULATOR_ID" se.openid.PassportCapture
          sleep 3
          xcrun simctl io "$SIMULATOR_ID" screenshot "$RUNNER_TEMP/ios-evidence/openID-iphone.png"
      - name: Save simulator screenshot and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, MIT
        with:
          name: iphone-app-evidence
          path: ${{ runner.temp }}/ios-evidence
          retention-days: 14
