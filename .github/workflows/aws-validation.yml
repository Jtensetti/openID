name: AWS test infrastructure
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exercise beta ingress with generated TLS on loopback
        shell: bash
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/nginx-tested-revision.txt"
          sha256sum deployment/beta-nginx.conf > "$RUNNER_TEMP/nginx-config.sha256"
          python3 deployment/test_beta_nginx.py | tee "$RUNNER_TEMP/nginx-ingress.json"
      - name: Save ingress regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nginx-ingress-evidence
          path: |
            ${{ runner.temp }}/nginx-tested-revision.txt
            ${{ runner.temp }}/nginx-config.sha256
            ${{ runner.temp }}/nginx-ingress.json
          retention-days: 90
      - name: Test resource expiry boundaries
        run: |
          python3.12 -m venv "$RUNNER_TEMP/aws-venv"
          "$RUNNER_TEMP/aws-venv/bin/pip" install --require-hashes --only-binary=:all: -r deployment/aws/requirements.lock
          "$RUNNER_TEMP/aws-venv/bin/python" -m unittest discover -s deployment/aws -v
          "$RUNNER_TEMP/aws-venv/bin/python" -m unittest discover -s deployment/archive -v
      - name: Check resource security rules
        run: |
          curl --fail --location --retry 3 https://github.com/aws-cloudformation/cloudformation-guard/releases/download/3.2.1/cfn-guard-v3-x86_64-ubuntu-latest.tar.gz --output "$RUNNER_TEMP/guard.tar.gz"
          printf '%s  %s\n' 09c2b8cfd81d513374a8da89d4805dc55006a3da52bbf598e272022d4d198e94 "$RUNNER_TEMP/guard.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/guard"
          tar -xzf "$RUNNER_TEMP/guard.tar.gz" -C "$RUNNER_TEMP/guard"
          python3 deployment/aws/template.py --ami ami-0123456789abcdef0 > "$RUNNER_TEMP/template.json"
          "$RUNNER_TEMP/guard/cfn-guard-v3-x86_64-ubuntu-latest/cfn-guard" validate --rules deployment/aws/security.guard --data "$RUNNER_TEMP/template.json"
          python3 deployment/archive/template.py > "$RUNNER_TEMP/archive-template.json"
          "$RUNNER_TEMP/guard/cfn-guard-v3-x86_64-ubuntu-latest/cfn-guard" validate --rules deployment/archive/security.guard --data "$RUNNER_TEMP/archive-template.json" --output-format json
          python3 deployment/security/template.py > "$RUNNER_TEMP/security-template.json"
          "$RUNNER_TEMP/guard/cfn-guard-v3-x86_64-ubuntu-latest/cfn-guard" validate --rules deployment/security/security.guard --data "$RUNNER_TEMP/security-template.json" --output-format json
          GUARD_BIN="$RUNNER_TEMP/guard/cfn-guard-v3-x86_64-ubuntu-latest/cfn-guard" python3 -m unittest discover -s deployment/security -v
