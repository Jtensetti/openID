name: Server and authentication tests
on:
  push:
    branches: [main, 'feat/**']
    paths: ['prototype/**', 'ops/**', 'verification/**', 'deployment/cluster/**', '.github/workflows/prototype.yml', '.github/scripts/postgres-tls.sh']
  pull_request:
    paths: ['prototype/**', 'ops/**', 'verification/**', 'deployment/cluster/**', '.github/workflows/prototype.yml', '.github/scripts/postgres-tls.sh']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: openid_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d openid_test" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install exact Temurin JDK with verified archive checksum
        shell: bash
        run: |
          curl --fail --location --retry 3 'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12.1%2B1/OpenJDK21U-jdk_x64_linux_hotspot_21.0.12.1_1.tar.gz' --output "$RUNNER_TEMP/lab-jdk.tar.gz"
          printf '%s  %s\n' 'ce79869e1307ed8ee1e2baa86a412b1eb5b75d10a01006d788a6f968bcfaee94' "$RUNNER_TEMP/lab-jdk.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/lab-jdk.tar.gz" --directory "$RUNNER_TEMP"
          printf 'JAVA_HOME=%s\n' "$RUNNER_TEMP/jdk-21.0.12.1+1" >> "$GITHUB_ENV"
          printf '%s\n' "$RUNNER_TEMP/jdk-21.0.12.1+1/bin" >> "$GITHUB_PATH"
      - name: Compile and test HTTPS, SAML and lifecycle
        run: ./mvnw -B -ntp clean verify dependency:list -DoutputAbsoluteArtifactFilename=true -DoutputFile=target/dependencies.txt
      - name: Verify resolved versions and SHA-256 checksums
        run: python3 scripts/dependencies.py
      - name: Packaged CLI smoke test with certificate verification
        run: python3 scripts/smoke.py
      - name: Restart, durable revocation, backup and restore drill
        run: python3 scripts/recovery-smoke.py
      - name: Deployment container HTTP and negative route tests
        run: python3 -m unittest discover -s ../ops/tests -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Install pinned browser test tooling
        run: npm ci --ignore-scripts
      - name: Install Chromium for the pinned Playwright version
        run: npx --no-install playwright install --with-deps chromium --only-shell
      - name: Browser SAML, WebAuthn USB/platform, PWA and revocation
        run: npm run test:browser

      - name: Install locked local verification dependencies and models
        working-directory: verification
        run: |
          python3.12 -m venv .venv
          .venv/bin/pip install --require-hashes --only-binary=:all: -r requirements.lock
          .venv/bin/pip install --require-hashes --only-binary=:all: -r rp-requirements.lock
          .venv/bin/pip install --require-hashes --only-binary=:all: -r runtime-requirements.lock
          npm ci --ignore-scripts
          .venv/bin/python download_models.py
      - name: Export generated passport fixtures and ensure executable packaging
        run: ./mvnw -B -ntp -Dtest=PassportVerifierTest -Dproofing.fixtureDirectory=/tmp/openid-proofing-fixtures test package spring-boot:repackage
      - name: Test verifier, PAD, native binding and rejection cases
        working-directory: verification
        run: |
          export PROOFING_FIXTURES=/tmp/openid-proofing-fixtures
          export PROOFING_JAVA="$JAVA_HOME/bin/java"
          export PROOFING_PYTHON="$PWD/.venv/bin/python"
          .venv/bin/python -m unittest -v test_verification test_native test_chip test_wallet test_relying_party test_identity test_identity_key test_registry_binding test_runtime test_crypto_runtime test_revocation test_notices
          .venv/bin/python -m unittest discover -s ../deployment/continuity -p 'test_*.py' -v
          .venv/bin/python runtime_smoke.py
          .venv/bin/python load_runtime.py --requests 400 --concurrency 32 --output "$RUNNER_TEMP/runtime-load.json"
          node --test test-attest.mjs
          node browser-test.cjs
          node rp-browser-test.cjs
          node federation-browser-test.cjs
      - name: Browser SAML against PostgreSQL and OpenBao over TLS
        working-directory: verification
        env:
          POSTGRES_CONTAINER: '${{ job.services.postgres.id }}'
          OPENID_TEST_POSTGRES: 'host=127.0.0.1 port=5432 dbname=openid_test user=postgres password=disposable-ci-password sslmode=verify-full sslrootcert=${{ runner.temp }}/postgres.crt'
          OPENID_TEST_BAO: '${{ runner.temp }}/bao/bao'
        run: |
          .venv/bin/pip install --require-hashes --only-binary=:all: -r cluster-requirements.lock
          curl --fail --location --retry 3 'https://github.com/openbao/openbao/releases/download/v2.7.1/openbao_2.7.1_linux_amd64.tar.gz' --output "$RUNNER_TEMP/bao.tar.gz"
          printf '%s  %s\n' '0e2f1ce10d124e03112b50dd2fbec6b78003783253bc3a91587938f39d1e2243' "$RUNNER_TEMP/bao.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/bao"
          tar -xzf "$RUNNER_TEMP/bao.tar.gz" -C "$RUNNER_TEMP/bao"
          bash ../.github/scripts/postgres-tls.sh
          export PROOFING_FIXTURES=/tmp/openid-proofing-fixtures
          export PROOFING_JAVA="$JAVA_HOME/bin/java"
          export PROOFING_PYTHON="$PWD/.venv/bin/python"
          node federation-browser-test.cjs
      - name: Save runtime capacity measurement
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-capacity
          path: ${{ runner.temp }}/runtime-load.json
          retention-days: 14
