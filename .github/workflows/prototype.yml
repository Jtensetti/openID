name: Server and authentication tests
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: openid_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d openid_test" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install exact Temurin JDK with verified archive checksum
        shell: bash
        run: |
          curl --fail --location --retry 3 'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.13%2B9/OpenJDK21U-jdk_x64_linux_hotspot_21.0.13_9.tar.gz' --output "$RUNNER_TEMP/lab-jdk.tar.gz"
          printf '%s  %s\n' 'd7f5d5cf865a2902b70ff549b97586a7d3f234e016f041ab447ea740c7d66d1c' "$RUNNER_TEMP/lab-jdk.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/lab-jdk.tar.gz" --directory "$RUNNER_TEMP"
          printf 'JAVA_HOME=%s\n' "$RUNNER_TEMP/jdk-21.0.13+9" >> "$GITHUB_ENV"
          printf '%s\n' "$RUNNER_TEMP/jdk-21.0.13+9/bin" >> "$GITHUB_PATH"
      - name: Compile and test HTTPS, SAML and lifecycle
        run: ./mvnw -B -ntp clean verify dependency:list -DoutputAbsoluteArtifactFilename=true -DoutputFile=target/dependencies.txt -Dsignature.fixtureDirectory=target/signature-fixtures
      - name: Verify document signature using the independent OpenSSL implementation
        run: python3 scripts/verify-signature.py target/signature-fixtures/synthetic-signature.zip --report target/signature-fixtures/openssl-results.json
      - name: Verify resolved versions and SHA-256 checksums
        run: python3 scripts/dependencies.py
      - name: Packaged CLI smoke test with certificate verification
        run: python3 scripts/smoke.py
      - name: Restart, durable revocation, backup and restore drill
        run: python3 scripts/recovery-smoke.py
      - name: Deployment container HTTP and negative route tests
        run: python3 -m unittest discover -s ../ops/tests -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Test browser feedback for failed and blocked completion
        run: node ../verification/test-phone-feedback.cjs
      - name: Install pinned browser test tooling
        run: npm ci --ignore-scripts
      - name: Use the official Ubuntu archive for browser dependencies
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          source = Path('/etc/apt/sources.list.d/ubuntu.sources')
          original = source.read_text()
          updated = original.replace('mirror+file:/etc/apt/apt-mirrors.txt',
                                     'https://archive.ubuntu.com/ubuntu')
          for scheme in ('http', 'https'):
              updated = updated.replace(f'{scheme}://azure.archive.ubuntu.com/ubuntu',
                                        'https://archive.ubuntu.com/ubuntu')
          if updated != original:
              source.write_text(updated)
          print('Ubuntu source URI checked; suites, components and signing key unchanged.')
          PY
      - name: Install Chromium for the pinned Playwright version
        run: npx --no-install playwright install --with-deps chromium --only-shell
      - name: Browser SAML, WebAuthn USB/platform, PWA and revocation
        run: npm run test:browser

      - name: Install locked local verification dependencies and models
        working-directory: verification
        run: |
          python3.12 -m venv .venv
          .venv/bin/pip install --require-hashes --only-binary=:all: -r requirements.lock
          .venv/bin/pip install --require-hashes --only-binary=:all: -r rp-requirements.lock
          .venv/bin/pip install --require-hashes --only-binary=:all: -r runtime-requirements.lock
          npm ci --ignore-scripts
          .venv/bin/python download_models.py
      - name: Export generated passport fixtures and ensure executable packaging
        run: ./mvnw -B -ntp -Dtest=PassportVerifierTest -Dproofing.fixtureDirectory=/tmp/openid-proofing-fixtures test package spring-boot:repackage
      - name: Test verifier, PAD, native binding and rejection cases
        working-directory: verification
        run: |
          export PROOFING_FIXTURES=/tmp/openid-proofing-fixtures
          export PROOFING_JAVA="$JAVA_HOME/bin/java"
          export PROOFING_PYTHON="$PWD/.venv/bin/python"
          .venv/bin/python -m unittest -v test_verification test_image_input test_biometric_diagnostics test_native test_chip test_wallet test_relying_party test_identity test_identity_key test_registry_binding test_runtime test_recovery_operations test_recovery_binding test_crypto_runtime test_revocation test_notices test_continuity_config test_continuity_operator test_pose test_security_code test_biometric_budget test_passport_revocation test_cluster_revocation
          .venv/bin/python -m unittest -v test_audit_archive
          .venv/bin/python -m unittest -v test_enrollment_policy test_acceptance_journal test_enrollment_consent
          .venv/bin/python -m unittest -v test_sqlite_retention
          .venv/bin/python -m unittest -v test_crl_maintenance
          .venv/bin/python -m unittest -v test_ingress_client
          .venv/bin/python -m unittest -v test_bounded_process test_profile_worker test_worker_confinement
          .venv/bin/python -m unittest discover -s ../deployment/continuity -p 'test_*.py' -v
          .venv/bin/python runtime_smoke.py
          .venv/bin/python load_runtime.py --requests 400 --concurrency 32 --output "$RUNNER_TEMP/runtime-load.json"
          node --test test-attest.mjs
          node browser-test.cjs
          node rp-browser-test.cjs
          node federation-browser-test.cjs
      - name: Browser SAML against PostgreSQL and OpenBao over TLS
        working-directory: verification
        env:
          POSTGRES_CONTAINER: '${{ job.services.postgres.id }}'
          OPENID_TEST_POSTGRES: 'host=127.0.0.1 port=5432 dbname=openid_test user=postgres password=disposable-ci-password sslmode=verify-full sslrootcert=${{ runner.temp }}/postgres.crt'
          OPENID_TEST_BAO: '${{ runner.temp }}/bao/bao'
        run: |
          .venv/bin/pip install --require-hashes --only-binary=:all: -r cluster-requirements.lock
          curl --fail --location --retry 3 'https://github.com/openbao/openbao/releases/download/v2.7.1/openbao_2.7.1_linux_amd64.tar.gz' --output "$RUNNER_TEMP/bao.tar.gz"
          printf '%s  %s\n' '0e2f1ce10d124e03112b50dd2fbec6b78003783253bc3a91587938f39d1e2243' "$RUNNER_TEMP/bao.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/bao"
          tar -xzf "$RUNNER_TEMP/bao.tar.gz" -C "$RUNNER_TEMP/bao"
          bash ../.github/scripts/postgres-tls.sh
          export PROOFING_FIXTURES=/tmp/openid-proofing-fixtures
          export PROOFING_JAVA="$JAVA_HOME/bin/java"
          export PROOFING_PYTHON="$PWD/.venv/bin/python"
          node federation-browser-test.cjs
      - name: Save runtime capacity measurement
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-capacity
          path: ${{ runner.temp }}/runtime-load.json
          retention-days: 14
      - name: Package SAML and signature evidence
        if: always()
        env:
          SOURCE_REVISION: '${{ github.event.pull_request.head.sha || github.sha }}'
        run: python3 scripts/collect-evidence.py --kind java --output "$RUNNER_TEMP/assurance-evidence" --job-status '${{ job.status }}'
      - name: Save SAML and signature evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: saml-signature-evidence
          path: '${{ runner.temp }}/assurance-evidence'
          retention-days: 90
