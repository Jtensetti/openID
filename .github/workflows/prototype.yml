name: Isolated synthetic e-id lab
on:
  push:
    branches: [main, 'feat/**']
    paths: ['prototype/**', '.github/workflows/prototype.yml']
  pull_request:
    paths: ['prototype/**', '.github/workflows/prototype.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21.0.12.1+1'
      - name: Compile, real HTTPS flows, adversarial SAML and lifecycle tests
        run: ./mvnw -B -ntp clean verify dependency:list -DoutputAbsoluteArtifactFilename=true -DoutputFile=target/dependencies.txt
      - name: Verify resolved versions and SHA-256 checksums
        run: python3 scripts/dependencies.py
      - name: Packaged CLI smoke test with certificate verification
        run: python3 scripts/smoke.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Install pinned browser test tooling
        run: npm ci --ignore-scripts
      - name: Install Chromium for the pinned Playwright version
        run: npx --no-install playwright install --with-deps chromium --only-shell
      - name: Real browser login, logout and revocation
        run: npm run test:browser
