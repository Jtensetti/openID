name: Private pilot runtime
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: openid_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d openid_test" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test bundle rejection and import safety
        run: |
          python3 -m unittest discover -s deployment -p test_image_bundle.py -v
          python3 -m unittest discover -s deployment/cluster -p test_probe.py -v
      - name: Require one pinned image and reject beta code overlays
        run: |
          set -euo pipefail
          export OPENID_BETA_DIRECTORY=/tmp/openid-beta-compose-check
          export OPENID_NOTICE_QUEUE_URL=https://example.invalid/queue
          if env -u OPENID_BETA_IMAGE_ID docker compose -f deployment/beta-compose.yaml \
            -f deployment/continuity-compose.yaml config --format json >/dev/null 2>&1; then
            echo 'Beta Compose accepted a missing image ID' >&2
            exit 1
          fi
          export OPENID_BETA_IMAGE_ID="sha256:$(printf 'a%.0s' {1..64})"
          docker compose -f deployment/beta-compose.yaml -f deployment/continuity-compose.yaml \
            config --format json | python3 deployment/image_bundle.py check-beta-compose --image-id "$OPENID_BETA_IMAGE_ID"
      - name: Test OS scan coverage, stale databases and rejected evidence
        run: |
          python3 .github/scripts/test_audit_image_os.py -v
          python3 deployment/build/test_runtime_policy.py -v
      - name: Reject altered package origins and unsafe image permissions
        run: |
          python3 deployment/build/test_python_wheels.py -v
          python3 deployment/build/test_image_surface.py -v
          python3 deployment/build/test_file_privileges.py -v
      - name: Export tracked source only
        id: source_export
        run: |
          mkdir "$RUNNER_TEMP/image-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/image-source"
      - name: Build pinned private pilot image
        run: docker build --platform linux/amd64 --tag openid-pilot:ci --file "$RUNNER_TEMP/image-source/deployment/Dockerfile" "$RUNNER_TEMP/image-source"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Prepare locked PostgreSQL and key-service runtime checks
        run: |
          python3.12 -m venv verification/.venv
          verification/.venv/bin/pip install --require-hashes --only-binary=:all: -r verification/cluster-requirements.lock -r verification/runtime-requirements.lock -r verification/rp-requirements.lock -r deployment/aws/requirements.lock
          sed -n '/^numpy==/p; /^opencv-python-headless==/p' verification/requirements.lock > "$RUNNER_TEMP/image-requirements.lock"
          verification/.venv/bin/pip install --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/image-requirements.lock"
          curl --fail --location --retry 3 'https://github.com/openbao/openbao/releases/download/v2.7.1/openbao_2.7.1_linux_amd64.tar.gz' --output "$RUNNER_TEMP/bao.tar.gz"
          printf '%s  %s\n' '0e2f1ce10d124e03112b50dd2fbec6b78003783253bc3a91587938f39d1e2243' "$RUNNER_TEMP/bao.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/bao"
          tar -xzf "$RUNNER_TEMP/bao.tar.gz" -C "$RUNNER_TEMP/bao"
      - name: Enable verified database TLS for the application image
        env:
          POSTGRES_CONTAINER: '${{ job.services.postgres.id }}'
        run: bash .github/scripts/postgres-tls.sh
      - name: Use a database owner without superuser privileges
        env:
          POSTGRES_CONTAINER: '${{ job.services.postgres.id }}'
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d openid_test -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE test_bootstrap LOGIN NOSUPERUSER NOBYPASSRLS CREATEDB CREATEROLE PASSWORD 'disposable-bootstrap-password'" \
            -c 'ALTER DATABASE openid_test OWNER TO test_bootstrap'
      - name: Test the common application image with PostgreSQL and Transit
        working-directory: verification
        env:
          OPENID_TEST_POSTGRES: 'host=127.0.0.1 port=5432 dbname=openid_test user=test_bootstrap password=disposable-bootstrap-password sslmode=verify-full sslrootcert=${{ runner.temp }}/postgres.crt'
          OPENID_TEST_BAO: '${{ runner.temp }}/bao/bao'
          OPENID_TEST_CONTAINER: openid-pilot:ci
        run: |
          .venv/bin/python -m unittest -v \
            test_cluster.ClusterTests.test_bridge_command_private_profile_signing_notices_and_external_revocation \
            test_cluster.ClusterTests.test_bridge_command_sandbox_profile_binds_audiences_and_restarts \
            test_cluster.ClusterTests.test_bridge_command_partial_start_failure_releases_federation_socket \
            test_cluster.ClusterTests.test_four_tls_workers_share_state_and_survive_instance_loss
      - name: Test packaged short-lived AWS credential boundaries without AWS calls
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 256m --cpus 1 \
            --tmpfs /tmp:size=32m,mode=1777 -e PYTHONPATH=/tests:/app/verification \
            -v "$PWD/verification/test_aws_credentials.py:/tests/test_aws_credentials.py:ro" \
            -v "$PWD/deployment/build/runtime_evidence.py:/tests/runtime_evidence.py:ro" \
            --entrypoint python openid-pilot:ci -m unittest -v test_aws_credentials
      - name: Run the complete canonical PostgreSQL and non-dev OpenBao profile
        run: |
          sudo apt-get update -qq
          sudo systemctl stop nginx.service || true
          sudo systemctl mask --runtime nginx.service
          sudo apt-get install --no-install-recommends --yes nftables nginx
          sudo env PATH="$PATH" GITHUB_ACTIONS=true verification/.venv/bin/python \
            deployment/production/runtime_probe.py \
            --image "$(docker image inspect openid-pilot:ci --format '{{.Id}}')" \
            --output "$RUNNER_TEMP/canonical-runtime.json"
      - name: Start the packaged bridge with empty synthetic storage
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 256m --cpus 1 \
            --tmpfs /tmp:size=16m,mode=1777 \
            --tmpfs /srv/openid/data:size=16m,mode=0700,uid=10001,gid=10001 \
            -e OPENID_SYNTHETIC_BRIDGE_PROBE=1 \
            -v "$RUNNER_TEMP/image-source/deployment/probe_packaged_bridge.py:/checks/probe.py:ro" \
            --entrypoint python openid-pilot:ci /checks/probe.py
      - name: Test actual packaged image codecs and face models without network
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 128 --memory 2g --cpus 2 \
            --tmpfs /tmp:size=128m,mode=1777 \
            -v "$PWD/verification/test_verification.py:/app/verification/test_verification.py:ro" \
            -v "$PWD/verification/test_image_input.py:/app/verification/test_image_input.py:ro" \
            -v "$PWD/verification/test_bounded_process.py:/app/verification/test_bounded_process.py:ro" \
            -v "$PWD/verification/test_profile_worker.py:/app/verification/test_profile_worker.py:ro" \
            -v "$PWD/verification/test_worker_confinement.py:/app/verification/test_worker_confinement.py:ro" \
            --entrypoint python openid-pilot:ci -m unittest -v test_verification.FaceTests test_image_input test_bounded_process test_profile_worker test_worker_confinement
      - name: Read a previous SQLite database and restore its stale backup safely
        run: |
          mkdir -m 700 "$RUNNER_TEMP/sqlite-transition"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 32 --memory 256m --cpus 1 \
            --user "$(id -u):$(id -g)" --tmpfs /tmp:size=32m,mode=1777 \
            -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONPATH=/app/verification \
            -v "$RUNNER_TEMP/image-source/verification:/app/verification:ro" \
            -v "$RUNNER_TEMP/image-source/deployment/build/sqlite_transition.py:/checks/sqlite_transition.py:ro" \
            -v "$RUNNER_TEMP/sqlite-transition:/transition" \
            --entrypoint python \
            python:3.12.15-slim-bookworm@sha256:6a0e06f5ba0b373d051aabd3fffb9b873f27f9a2a3a14bcbe37dee6f0e3bbc70 \
            /checks/sqlite_transition.py seed /transition
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 32 --memory 256m --cpus 1 \
            --user "$(id -u):$(id -g)" --tmpfs /tmp:size=32m,mode=1777 \
            -e PYTHONPATH=/app/verification \
            -v "$RUNNER_TEMP/image-source/deployment/build/sqlite_transition.py:/checks/sqlite_transition.py:ro" \
            -v "$RUNNER_TEMP/sqlite-transition:/transition" \
            --entrypoint python openid-pilot:ci /checks/sqlite_transition.py check /transition
          cp "$RUNNER_TEMP/sqlite-transition/sqlite-transition.json" "$RUNNER_TEMP/sqlite-transition.json"
      - name: Prepare generated certificates and private volumes
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=Generated-test-CSCA -keyout "$RUNNER_TEMP/test-csca.key" -out "$RUNNER_TEMP/test-csca.pem"
          python3 deployment/setup.py --directory "$RUNNER_TEMP/openid-pilot" --address 127.0.0.1 --team ABCDEFGHIJ --csca "$RUNNER_TEMP/test-csca.pem"
          chmod 700 "$RUNNER_TEMP/openid-pilot"
          echo "OPENID_DIRECTORY=$RUNNER_TEMP/openid-pilot" >> "$GITHUB_ENV"
      - name: Run verifier with read-only filesystem and no network
        run: |
          docker run --detach --name openid-pilot --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 2g --cpus 2 --user "$(id -u):$(id -g)" --tmpfs /tmp:size=128m,mode=1777 -v "$OPENID_DIRECTORY/runtime.json:/srv/openid/runtime.json:ro" -v "$OPENID_DIRECTORY/secrets:/srv/openid/secrets:ro" -v "$OPENID_DIRECTORY/data:/srv/openid/data" openid-pilot:ci
          for attempt in $(seq 1 90); do
            if docker exec openid-pilot python probe.py /srv/openid/runtime.json; then break; fi
            sleep 1
          done
          docker exec openid-pilot python probe.py /srv/openid/runtime.json
          docker exec openid-pilot node --version
          docker exec openid-pilot java -version
          docker exec openid-pilot python crl_maintenance.py --help
          docker exec openid-pilot python sqlite_retention.py --help
          docker exec -i openid-pilot python - <<'PY'
          import json, subprocess
          result=subprocess.run(['java','-Xmx128m','-jar','/app/prototype/target/isolated-eid-lab.jar',
              'check-crls','/srv/openid/secrets/trusted-csca.pem'], input=b'{"candidate":"YQ=="}',
              capture_output=True, timeout=30)
          assert result.returncode==2
          assert json.loads(result.stdout)=={'status':'REJECTED','error':'CRL_UPDATE_REJECTED'}
          print('PASS: packaged CRL verifier rejects invalid input')
          PY
          docker exec openid-pilot python --version > "$RUNNER_TEMP/runtime-versions.txt"
          docker exec openid-pilot node --version >> "$RUNNER_TEMP/runtime-versions.txt"
          docker exec openid-pilot java -version >> "$RUNNER_TEMP/runtime-versions.txt" 2>&1
          if docker exec openid-pilot python -c "from pathlib import Path; Path('/app/must-not-write').touch()"; then exit 1; fi
          docker exec openid-pilot python -c "from pathlib import Path; assert not Path('/app/verification/test_runtime.py').exists(); assert not Path('/app/verification/test_chip_fixture.py').exists(); assert not Path('/bin/sh').exists()"
      - name: Run packaged local test service
        run: |
          docker run --detach --name openid-rp --network container:openid-pilot --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 32 --memory 256m --cpus 1 --user "$(id -u):$(id -g)" --tmpfs /tmp:size=16m,mode=1777 -v "$OPENID_DIRECTORY/data:/srv/openid/data" --entrypoint python openid-pilot:ci relying_party.py --db /srv/openid/data/wallet.sqlite
          docker exec -i openid-pilot python - <<'PY'
          import http.client, json, time
          for _ in range(30):
              try:
                  c=http.client.HTTPConnection('localhost',8766,timeout=2)
                  c.request('GET','/session'); r=c.getresponse()
                  assert r.status==200 and 'HttpOnly' in r.getheader('Set-Cookie')
                  assert len(json.loads(r.read())['csrf'])==64
                  c.close(); break
              except OSError: time.sleep(1)
          else: raise AssertionError('Local service did not start')
          c=http.client.HTTPConnection('localhost',8766,timeout=2)
          c.request('POST','/login','{}',{'Origin':'http://attacker.invalid','Content-Type':'application/json'})
          assert c.getresponse().status==403
          c.close()
          print('PASS: packaged local service and origin rejection')
          PY
      - name: Validate Compose configuration and collect package inventory
        run: |
          export OPENID_UID="$(id -u)" OPENID_GID="$(id -g)"
          docker compose -f deployment/compose.yaml config --quiet
          docker exec -i openid-pilot python - < deployment/build/python_inventory.py > "$RUNNER_TEMP/python-packages.json"
          docker exec -i openid-pilot python - > "$RUNNER_TEMP/runtime-components.json" <<'PY'
          import hashlib, json, ssl, sqlite3, sys, subprocess, pyexpat, cv2
          from importlib.metadata import distribution
          from pathlib import Path
          assert sys.version_info[:3] == (3, 12, 16)
          assert pyexpat.EXPAT_VERSION == 'expat_2.9.0'
          opencv = distribution('opencv-python-headless')
          sbom_paths = [p for p in opencv.files if str(p).endswith('/sboms/auditwheel.cdx.json')]
          assert len(sbom_paths) == 1, 'OpenCV upstream SBOM missing or ambiguous'
          opencv_sbom = opencv.locate_file(sbom_paths[0]).read_bytes()
          print(json.dumps({
              'python': sys.version,
              'pythonImageLockSHA256': hashlib.sha256(Path('/usr/share/doc/openid-python/build-lock.json').read_bytes()).hexdigest(),
              'pythonOpenSSL': ssl.OPENSSL_VERSION,
              'pythonSQLite': sqlite3.sqlite_version,
              'pythonExpat': pyexpat.EXPAT_VERSION,
              'pythonExecutableSHA256': hashlib.sha256(Path(sys.executable).read_bytes()).hexdigest(),
              'pipBuildTool': json.loads(Path('/usr/share/doc/openid-python/pip-build-tool.json').read_text()),
              'pipRemoval': json.loads(Path('/usr/share/doc/openid-python/pip-removal.json').read_text()),
              'pipUpstreamSbomSHA256': hashlib.sha256(Path('/usr/share/doc/openid-python/pip-upstream-sbom.cdx.json').read_bytes()).hexdigest(),
              'node': json.loads(subprocess.check_output(['node', '-p', 'JSON.stringify(process.versions)'], text=True)),
              'temurinRelease': Path('/opt/java/openjdk/release').read_text(),
              'temurinUpstreamSbomSHA256': hashlib.sha256(Path('/opt/java/openjdk/upstream-sbom.cdx.json').read_bytes()).hexdigest(),
              'opencv': {
                  'packageVersion': opencv.version, 'libraryVersion': cv2.__version__,
                  'buildInformation': cv2.getBuildInformation(),
                  'upstreamSbom': json.loads(opencv_sbom),
                  'upstreamSbomSHA256': hashlib.sha256(opencv_sbom).hexdigest(),
                  'fileSHA256': {str(p): hashlib.sha256(opencv.locate_file(p).read_bytes()).hexdigest()
                      for p in opencv.files if str(p).startswith(('opencv_python_headless.libs/', 'cv2/LICENSE')) or str(p) == 'cv2/cv2.abi3.so'},
              },
              'scope': 'Runtime component inventory; not a complete runtime vulnerability assessment.'
          }, indent=2))
          PY
          docker cp openid-pilot:/opt/java/openjdk/upstream-sbom.cdx.json "$RUNNER_TEMP/temurin-upstream-sbom.cdx.json"
          docker cp openid-pilot:/usr/share/doc/openid-runtime "$RUNNER_TEMP/debian-runtime-evidence"
          docker cp openid-pilot:/usr/share/doc/openid-python "$RUNNER_TEMP/python-runtime-evidence"
          docker image inspect openid-pilot:ci --format '{{.Id}}' > "$RUNNER_TEMP/image-id.txt"
          timeout 120s docker run --rm --network none --read-only --cap-drop ALL --cap-add DAC_READ_SEARCH --user 0:0 \
            --security-opt no-new-privileges --pids-limit 32 --memory 128m --cpus 1 \
            -v "$PWD/deployment/build/file_privileges.py:/checks/file_privileges.py:ro" \
            --entrypoint python "$(cat "$RUNNER_TEMP/image-id.txt")" -B /checks/file_privileges.py check \
            --image-id "$(cat "$RUNNER_TEMP/image-id.txt")" --revision "$(git rev-parse HEAD)" \
            > "$RUNNER_TEMP/file-privileges.json"
          timeout 120s docker run --rm --name openid-image-surface --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 32 --memory 128m --cpus 1 \
            -v "$PWD/deployment/build/image_surface.py:/checks/image_surface.py:ro" \
            --entrypoint python "$(cat "$RUNNER_TEMP/image-id.txt")" -B /checks/image_surface.py \
            --image-id "$(cat "$RUNNER_TEMP/image-id.txt")" --revision "$(git rev-parse HEAD)" \
            > "$RUNNER_TEMP/image-surface.json"
          timeout 120s docker run --rm --name openid-image-surface-root --network none --read-only \
            --cap-drop ALL --cap-add DAC_READ_SEARCH --user 0:0 --security-opt no-new-privileges \
            --pids-limit 32 --memory 128m --cpus 1 \
            -v "$PWD/deployment/build/image_surface.py:/checks/image_surface.py:ro" \
            --entrypoint python "$(cat "$RUNNER_TEMP/image-id.txt")" -B /checks/image_surface.py \
            --whole-image --image-id "$(cat "$RUNNER_TEMP/image-id.txt")" --revision "$(git rev-parse HEAD)" \
            > "$RUNNER_TEMP/image-surface-root.json"
          docker stop --time 10 openid-rp
          docker stop --time 70 openid-pilot
          test "$(docker inspect openid-pilot --format '{{.State.ExitCode}}')" = 0
      - name: SAML and OIDC integration with generated identities and no external network
        run: |
          mkdir "$RUNNER_TEMP/protocol-evidence"
          mkdir "$RUNNER_TEMP/protocol-tests"
          cp verification/{protocol_evidence.py,oidc-negative-test.py,saml-negative-test.py,runtime_test_fixture.py,test_runtime_test_fixture.py,test_federation_config.py,test_identity.py,test_wallet.py,test_runtime.py,test_chip_fixture.py,test_native_retention.py,test_recovery_operations.py,test_recovery_binding.py,test_passport_revocation.py,test_ingress_client.py,test_crl_maintenance.py,test_sqlite_retention.py,test_consent_retention.py,test_subject_access.py,test_subject_erasure.py,test_erasure_helpers.py,test_enrollment_policy.py,test_enrollment_consent.py,test_acceptance_journal.py,test_test_beta.py,test_audit_archive.py,test_runtime_isolation.py} "$RUNNER_TEMP/protocol-tests/"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 2g --cpus 2 --user "$(id -u):$(id -g)" --tmpfs /tmp:size=256m,mode=1777 -e PYTHONPATH=/tests:/app/verification -v "$RUNNER_TEMP/protocol-tests:/tests:ro" --entrypoint python openid-pilot:ci -m unittest -v test_runtime_test_fixture test_federation_config test_wallet test_runtime test_native_retention test_recovery_operations test_recovery_binding test_passport_revocation test_ingress_client test_crl_maintenance.MaintenanceTests test_sqlite_retention test_consent_retention test_subject_access test_subject_erasure test_enrollment_consent test_acceptance_journal test_test_beta test_audit_archive test_runtime_isolation
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 2g --cpus 2 --user "$(id -u):$(id -g)" --sysctl net.ipv4.ip_unprivileged_port_start=0 --tmpfs /tmp:size=256m,mode=1777 --add-host idp.example.test:127.0.0.1 --add-host sp.example.test:127.0.0.1 -e PYTHONPATH=/tests:/app/verification -v "$RUNNER_TEMP/protocol-tests:/tests:ro" -v "$RUNNER_TEMP/protocol-evidence:/evidence" --entrypoint python openid-pilot:ci /tests/protocol_evidence.py --output /evidence/protocol-results.json
      - name: Package protocol evidence
        if: always()
        env:
          SOURCE_REVISION: '${{ github.event.pull_request.head.sha || github.sha }}'
        run: python3 prototype/scripts/collect-evidence.py --kind protocol --output "$RUNNER_TEMP/protocol-evidence" --job-status '${{ job.status }}'
      - name: Save protocol evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: protocol-evidence
          path: '${{ runner.temp }}/protocol-evidence'
          retention-days: 90
      - name: Audit every installed Debian package in the built image
        run: |
          python3 .github/scripts/audit_image_os.py \
            --image "$(cat "$RUNNER_TEMP/image-id.txt")" \
            --output "$RUNNER_TEMP/image-os-audit"
      - name: Audit exact vendor OS packages and embedded Go dependencies
        if: always()
        run: python3 deployment/production/audit_vendors.py --output "$RUNNER_TEMP/vendor-audit"
      - name: Inventory the three canonical images without inheriting application approval
        if: always()
        run: |
          python3 deployment/production/delivery_inventory.py \
            --image "$(cat "$RUNNER_TEMP/image-id.txt")" \
            --runtime "$RUNNER_TEMP/canonical-runtime.json" \
            --os-audit "$RUNNER_TEMP/image-os-audit" \
            --vendor-audit "$RUNNER_TEMP/vendor-audit" \
            --output "$RUNNER_TEMP/three-image-inventory.json" \
            --require-release-ready
      - name: Save image package inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pilot-image-inventory
          path: |
            ${{ runner.temp }}/python-packages.json
            ${{ runner.temp }}/image-id.txt
            ${{ runner.temp }}/image-surface.json
            ${{ runner.temp }}/image-surface-root.json
            ${{ runner.temp }}/file-privileges.json
            ${{ runner.temp }}/runtime-versions.txt
            ${{ runner.temp }}/runtime-components.json
            ${{ runner.temp }}/sqlite-transition.json
            ${{ runner.temp }}/canonical-runtime.json
            ${{ runner.temp }}/three-image-inventory.json
            ${{ runner.temp }}/python-runtime-evidence
            ${{ runner.temp }}/debian-runtime-evidence
            ${{ runner.temp }}/temurin-upstream-sbom.cdx.json
            ${{ runner.temp }}/image-os-audit/
            ${{ runner.temp }}/vendor-audit/
          if-no-files-found: error
          retention-days: 90
      - name: Logs and cleanup
        if: always()
        run: |
          docker logs openid-pilot || true
          docker logs openid-rp || true
          docker rm --force openid-pilot openid-rp openid-image-surface openid-image-surface-root || true
      - name: Package all three tested images and bound evidence
        run: |
          python3 deployment/production/release_bundle.py package --image openid-pilot:ci \
            --protocol "$RUNNER_TEMP/protocol-evidence/protocol-results.json" \
            --inventory "$RUNNER_TEMP/python-packages.json" \
            --os-audit "$RUNNER_TEMP/image-os-audit" \
            --vendor-audit "$RUNNER_TEMP/vendor-audit" \
            --runtime "$RUNNER_TEMP/canonical-runtime.json" \
            --output "$RUNNER_TEMP/image-bundle"
      - name: Verify export and reload without rebuilding
        run: |
          revision="$(git rev-parse HEAD)"
          manifest_sha="$(sha256sum "$RUNNER_TEMP/image-bundle/manifest.json" | cut -d ' ' -f 1)"
          docker image rm "openid-pilot:commit-$revision" openid-pilot:ci
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          vendors = json.loads(Path('deployment/production/vendor-images.lock.json').read_text())
          for role, vendor in vendors.items():
              subprocess.run(['docker', 'image', 'rm', 'tjipp-'+role+':commit-'+revision, vendor['source']], check=True)
          PY
          sudo python3 deployment/production/release_bundle.py import --directory "$RUNNER_TEMP/image-bundle" \
            --expected-revision "$revision" --expected-manifest-sha256 "$manifest_sha"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --entrypoint java \
            "openid-pilot:commit-$revision" -version
      - name: Retain deployable image after main push or manual build
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-image-${{ github.sha }}
          path: '${{ runner.temp }}/image-bundle'
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
