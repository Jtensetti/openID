name: Private pilot runtime
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      ncurses_candidate:
        description: 'Build and probe only the isolated ncurses candidate'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  container:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.ncurses_candidate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test bundle rejection and import safety
        run: python3 -m unittest discover -s deployment -p test_image_bundle.py -v
      - name: Test OS scan coverage, stale databases and rejected evidence
        run: python3 .github/scripts/test_audit_image_os.py -v
      - name: Reject altered package origins and invalid native comparison evidence
        run: |
          python3 deployment/build/test_python_wheels.py -v
          python3 deployment/build/opencv/test_compare.py -v
          python3 deployment/build/test_image_surface.py -v
          python3 deployment/build/test_file_privileges.py -v
      - name: Reject unsafe util-linux and ACL source, signature and test evidence
        id: util_linux_inputs
        run: |
          python3 -m unittest discover -s deployment/build/util_linux -p 'test_*.py' -v
          python3 -m unittest discover -s deployment/build/acl -p 'test_*.py' -v
      - name: Export tracked source only
        id: source_export
        run: |
          mkdir "$RUNNER_TEMP/image-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/image-source"
      - name: Build the authenticated util-linux package candidate without installing it
        id: util_linux_candidate
        if: ${{ !cancelled() && steps.util_linux_inputs.outcome == 'success' && steps.source_export.outcome == 'success' }}
        timeout-minutes: 25
        run: |
          set -euo pipefail
          candidate_source="$RUNNER_TEMP/image-source/deployment/build/util_linux"
          candidate_output="$RUNNER_TEMP/util-linux-evaluation"
          mkdir -m 700 "$candidate_output"
          git rev-parse HEAD > "$candidate_output/tested-revision.txt"
          python3 "$candidate_source/build.py" fetch --directory "$RUNNER_TEMP/util-linux-inputs" 2>&1 | tee "$candidate_output/fetch.log"
          docker build --platform linux/amd64 --tag openid-util-linux-builder:ci \
            --build-arg "BUILDER_UID=$(id -u)" --build-arg "BUILDER_GID=$(id -g)" \
            --file "$candidate_source/Dockerfile" "$candidate_source" 2>&1 | tee "$candidate_output/builder.log"
          docker run --rm --name openid-util-linux-candidate --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 512 \
            --memory 4g --cpus 2 --tmpfs /tmp:size=512m,mode=1777 \
            -v "$RUNNER_TEMP/util-linux-inputs:/inputs:ro" \
            -v "$candidate_output:/output" openid-util-linux-builder:ci 2>&1 | tee "$candidate_output/runner.log"
      - name: Stop any remaining candidate process before saving evidence
        if: always()
        run: docker rm --force openid-util-linux-candidate >/dev/null 2>&1 || true
      - name: Save package candidate evidence including failures
        if: ${{ always() && steps.util_linux_candidate.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: util-linux-build-candidate
          path: |
            ${{ runner.temp }}/util-linux-evaluation/*.log
            ${{ runner.temp }}/util-linux-evaluation/tested-revision.txt
            ${{ runner.temp }}/util-linux-evaluation/evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Build pinned private pilot image
        run: docker build --platform linux/amd64 --tag openid-pilot:ci --file "$RUNNER_TEMP/image-source/deployment/Dockerfile" "$RUNNER_TEMP/image-source"
      - name: Test actual packaged image codecs and face models without network
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 128 --memory 2g --cpus 2 \
            --tmpfs /tmp:size=128m,mode=1777 \
            -v "$PWD/verification/test_verification.py:/app/verification/test_verification.py:ro" \
            -v "$PWD/verification/test_image_input.py:/app/verification/test_image_input.py:ro" \
            -v "$PWD/verification/test_bounded_process.py:/app/verification/test_bounded_process.py:ro" \
            -v "$PWD/verification/test_profile_worker.py:/app/verification/test_profile_worker.py:ro" \
            -v "$PWD/verification/test_worker_confinement.py:/app/verification/test_worker_confinement.py:ro" \
            --entrypoint python openid-pilot:ci -m unittest -v test_verification.FaceTests test_image_input test_bounded_process test_profile_worker test_worker_confinement
      - name: Read a previous SQLite database and restore its stale backup safely
        run: |
          mkdir -m 700 "$RUNNER_TEMP/sqlite-transition"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 32 --memory 256m --cpus 1 \
            --user "$(id -u):$(id -g)" --tmpfs /tmp:size=32m,mode=1777 \
            -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONPATH=/app/verification \
            -v "$RUNNER_TEMP/image-source/verification:/app/verification:ro" \
            -v "$RUNNER_TEMP/image-source/deployment/build/sqlite_transition.py:/checks/sqlite_transition.py:ro" \
            -v "$RUNNER_TEMP/sqlite-transition:/transition" \
            --entrypoint python \
            python:3.12.15-slim-bookworm@sha256:6a0e06f5ba0b373d051aabd3fffb9b873f27f9a2a3a14bcbe37dee6f0e3bbc70 \
            /checks/sqlite_transition.py seed /transition
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 32 --memory 256m --cpus 1 \
            --user "$(id -u):$(id -g)" --tmpfs /tmp:size=32m,mode=1777 \
            -e PYTHONPATH=/app/verification \
            -v "$RUNNER_TEMP/image-source/deployment/build/sqlite_transition.py:/checks/sqlite_transition.py:ro" \
            -v "$RUNNER_TEMP/sqlite-transition:/transition" \
            --entrypoint python openid-pilot:ci /checks/sqlite_transition.py check /transition
          cp "$RUNNER_TEMP/sqlite-transition/sqlite-transition.json" "$RUNNER_TEMP/sqlite-transition.json"
      - name: Prepare generated certificates and private volumes
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=Generated-test-CSCA -keyout "$RUNNER_TEMP/test-csca.key" -out "$RUNNER_TEMP/test-csca.pem"
          python3 deployment/setup.py --directory "$RUNNER_TEMP/openid-pilot" --address 127.0.0.1 --team ABCDEFGHIJ --csca "$RUNNER_TEMP/test-csca.pem"
          chmod 700 "$RUNNER_TEMP/openid-pilot"
          echo "OPENID_DIRECTORY=$RUNNER_TEMP/openid-pilot" >> "$GITHUB_ENV"
      - name: Run verifier with read-only filesystem and no network
        run: |
          docker run --detach --name openid-pilot --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 2g --cpus 2 --user "$(id -u):$(id -g)" --tmpfs /tmp:size=128m,mode=1777 -v "$OPENID_DIRECTORY/runtime.json:/srv/openid/runtime.json:ro" -v "$OPENID_DIRECTORY/secrets:/srv/openid/secrets:ro" -v "$OPENID_DIRECTORY/data:/srv/openid/data" openid-pilot:ci
          for attempt in $(seq 1 90); do
            if docker exec openid-pilot python probe.py /srv/openid/runtime.json; then break; fi
            sleep 1
          done
          docker exec openid-pilot python probe.py /srv/openid/runtime.json
          docker exec openid-pilot node --version
          docker exec openid-pilot java -version
          docker exec openid-pilot python crl_maintenance.py --help
          docker exec openid-pilot python sqlite_retention.py --help
          docker exec -i openid-pilot python - <<'PY'
          import json, subprocess
          result=subprocess.run(['java','-Xmx128m','-jar','/app/prototype/target/isolated-eid-lab.jar',
              'check-crls','/srv/openid/secrets/trusted-csca.pem'], input=b'{"candidate":"YQ=="}',
              capture_output=True, timeout=30)
          assert result.returncode==2
          assert json.loads(result.stdout)=={'status':'REJECTED','error':'CRL_UPDATE_REJECTED'}
          print('PASS: packaged CRL verifier rejects invalid input')
          PY
          docker exec openid-pilot python --version > "$RUNNER_TEMP/runtime-versions.txt"
          docker exec openid-pilot node --version >> "$RUNNER_TEMP/runtime-versions.txt"
          docker exec openid-pilot java -version >> "$RUNNER_TEMP/runtime-versions.txt" 2>&1
          if docker exec openid-pilot touch /app/must-not-write; then exit 1; fi
          docker exec openid-pilot sh -c 'test ! -e /app/verification/test_runtime.py && test ! -e /app/verification/test_chip_fixture.py'
      - name: Run packaged local test service
        run: |
          docker run --detach --name openid-rp --network container:openid-pilot --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 32 --memory 256m --cpus 1 --user "$(id -u):$(id -g)" --tmpfs /tmp:size=16m,mode=1777 -v "$OPENID_DIRECTORY/data:/srv/openid/data" --entrypoint python openid-pilot:ci relying_party.py --db /srv/openid/data/wallet.sqlite
          docker exec -i openid-pilot python - <<'PY'
          import http.client, json, time
          for _ in range(30):
              try:
                  c=http.client.HTTPConnection('localhost',8766,timeout=2)
                  c.request('GET','/session'); r=c.getresponse()
                  assert r.status==200 and 'HttpOnly' in r.getheader('Set-Cookie')
                  assert len(json.loads(r.read())['csrf'])==64
                  c.close(); break
              except OSError: time.sleep(1)
          else: raise AssertionError('Local service did not start')
          c=http.client.HTTPConnection('localhost',8766,timeout=2)
          c.request('POST','/login','{}',{'Origin':'http://attacker.invalid','Content-Type':'application/json'})
          assert c.getresponse().status==403
          c.close()
          print('PASS: packaged local service and origin rejection')
          PY
      - name: Validate Compose configuration and collect package inventory
        run: |
          export OPENID_UID="$(id -u)" OPENID_GID="$(id -g)"
          docker compose -f deployment/compose.yaml config --quiet
          docker exec -i openid-pilot python - < deployment/build/python_inventory.py > "$RUNNER_TEMP/python-packages.json"
          docker exec -i openid-pilot python - > "$RUNNER_TEMP/runtime-components.json" <<'PY'
          import hashlib, json, ssl, sqlite3, sys, subprocess, pyexpat, cv2
          from importlib.metadata import distribution
          from pathlib import Path
          assert sys.version_info[:3] == (3, 12, 16)
          assert pyexpat.EXPAT_VERSION == 'expat_2.9.0'
          opencv = distribution('opencv-python-headless')
          sbom_paths = [p for p in opencv.files if str(p).endswith('/sboms/auditwheel.cdx.json')]
          assert len(sbom_paths) == 1, 'OpenCV upstream SBOM missing or ambiguous'
          opencv_sbom = opencv.locate_file(sbom_paths[0]).read_bytes()
          print(json.dumps({
              'python': sys.version,
              'pythonOpenSSL': ssl.OPENSSL_VERSION,
              'pythonSQLite': sqlite3.sqlite_version,
              'pythonExpat': pyexpat.EXPAT_VERSION,
              'pythonExecutableSHA256': hashlib.sha256(Path(sys.executable).read_bytes()).hexdigest(),
              'pythonSourceSbomSHA256': hashlib.sha256(Path('/usr/share/doc/openid-python/source.spdx.json').read_bytes()).hexdigest(),
              'pythonUpstreamTestsSHA256': hashlib.sha256(Path('/usr/share/doc/openid-python/upstream-tests.log').read_bytes()).hexdigest(),
              'pipBuildTool': json.loads(Path('/usr/share/doc/openid-python/pip-build-tool.json').read_text()),
              'pipRemoval': json.loads(Path('/usr/share/doc/openid-python/pip-removal.json').read_text()),
              'pythonTlsTestPatch': json.loads(Path('/usr/share/doc/openid-python/tls-test-patch.json').read_text()),
              'pipUpstreamSbomSHA256': hashlib.sha256(Path('/usr/share/doc/openid-python/pip-upstream-sbom.cdx.json').read_bytes()).hexdigest(),
              'node': json.loads(subprocess.check_output(['node', '-p', 'JSON.stringify(process.versions)'], text=True)),
              'temurinRelease': Path('/opt/java/openjdk/release').read_text(),
              'temurinUpstreamSbomSHA256': hashlib.sha256(Path('/opt/java/openjdk/upstream-sbom.cdx.json').read_bytes()).hexdigest(),
              'opencv': {
                  'packageVersion': opencv.version, 'libraryVersion': cv2.__version__,
                  'buildInformation': cv2.getBuildInformation(),
                  'upstreamSbom': json.loads(opencv_sbom),
                  'upstreamSbomSHA256': hashlib.sha256(opencv_sbom).hexdigest(),
                  'fileSHA256': {str(p): hashlib.sha256(opencv.locate_file(p).read_bytes()).hexdigest()
                      for p in opencv.files if str(p).startswith(('opencv_python_headless.libs/', 'cv2/LICENSE')) or str(p) == 'cv2/cv2.abi3.so'},
              },
              'scope': 'Runtime component inventory; not a complete runtime vulnerability assessment.'
          }, indent=2))
          PY
          docker cp openid-pilot:/opt/java/openjdk/upstream-sbom.cdx.json "$RUNNER_TEMP/temurin-upstream-sbom.cdx.json"
          docker cp openid-pilot:/usr/share/doc/openid-python "$RUNNER_TEMP/python-runtime-evidence"
          docker image inspect openid-pilot:ci --format '{{.Id}}' > "$RUNNER_TEMP/image-id.txt"
          timeout 120s docker run --rm --network none --read-only --cap-drop ALL --cap-add DAC_READ_SEARCH --user 0:0 \
            --security-opt no-new-privileges --pids-limit 32 --memory 128m --cpus 1 \
            -v "$PWD/deployment/build/file_privileges.py:/checks/file_privileges.py:ro" \
            --entrypoint python "$(cat "$RUNNER_TEMP/image-id.txt")" -B /checks/file_privileges.py check \
            --image-id "$(cat "$RUNNER_TEMP/image-id.txt")" --revision "$(git rev-parse HEAD)" \
            > "$RUNNER_TEMP/file-privileges.json"
          timeout 120s docker run --rm --name openid-image-surface --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 32 --memory 128m --cpus 1 \
            -v "$PWD/deployment/build/image_surface.py:/checks/image_surface.py:ro" \
            --entrypoint python "$(cat "$RUNNER_TEMP/image-id.txt")" -B /checks/image_surface.py \
            --image-id "$(cat "$RUNNER_TEMP/image-id.txt")" --revision "$(git rev-parse HEAD)" \
            > "$RUNNER_TEMP/image-surface.json"
          timeout 120s docker run --rm --name openid-image-surface-root --network none --read-only \
            --cap-drop ALL --cap-add DAC_READ_SEARCH --user 0:0 --security-opt no-new-privileges \
            --pids-limit 32 --memory 128m --cpus 1 \
            -v "$PWD/deployment/build/image_surface.py:/checks/image_surface.py:ro" \
            --entrypoint python "$(cat "$RUNNER_TEMP/image-id.txt")" -B /checks/image_surface.py \
            --whole-image --image-id "$(cat "$RUNNER_TEMP/image-id.txt")" --revision "$(git rev-parse HEAD)" \
            > "$RUNNER_TEMP/image-surface-root.json"
          docker stop --time 10 openid-rp
          docker stop --time 70 openid-pilot
          test "$(docker inspect openid-pilot --format '{{.State.ExitCode}}')" = 0
      - name: SAML and OIDC integration with generated identities and no external network
        run: |
          mkdir "$RUNNER_TEMP/protocol-evidence"
          mkdir "$RUNNER_TEMP/protocol-tests"
          cp verification/{protocol_evidence.py,oidc-negative-test.py,saml-negative-test.py,test_identity.py,test_wallet.py,test_runtime.py,test_chip_fixture.py,test_recovery_operations.py,test_recovery_binding.py,test_passport_revocation.py,test_ingress_client.py,test_crl_maintenance.py,test_sqlite_retention.py,test_audit_archive.py,federation.py} "$RUNNER_TEMP/protocol-tests/"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 2g --cpus 2 --user "$(id -u):$(id -g)" --tmpfs /tmp:size=256m,mode=1777 -e PYTHONPATH=/tests:/app/verification -v "$RUNNER_TEMP/protocol-tests:/tests:ro" --entrypoint python openid-pilot:ci -m unittest -v test_wallet test_runtime test_recovery_operations test_recovery_binding test_passport_revocation test_ingress_client test_crl_maintenance.MaintenanceTests test_sqlite_retention test_audit_archive
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 2g --cpus 2 --user "$(id -u):$(id -g)" --sysctl net.ipv4.ip_unprivileged_port_start=0 --tmpfs /tmp:size=256m,mode=1777 --add-host idp.example.test:127.0.0.1 --add-host sp.example.test:127.0.0.1 -e PYTHONPATH=/tests:/app/verification -v "$RUNNER_TEMP/protocol-tests:/tests:ro" -v "$RUNNER_TEMP/protocol-evidence:/evidence" --entrypoint python openid-pilot:ci /tests/protocol_evidence.py --output /evidence/protocol-results.json
      - name: Package protocol evidence
        if: always()
        env:
          SOURCE_REVISION: '${{ github.event.pull_request.head.sha || github.sha }}'
        run: python3 prototype/scripts/collect-evidence.py --kind protocol --output "$RUNNER_TEMP/protocol-evidence" --job-status '${{ job.status }}'
      - name: Save protocol evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: protocol-evidence
          path: '${{ runner.temp }}/protocol-evidence'
          retention-days: 90
      - name: Install the complete util-linux candidate offline in a separate image
        id: util_linux_trial
        if: ${{ success() && steps.util_linux_candidate.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          candidate_source="$RUNNER_TEMP/image-source/deployment/build/util_linux"
          trial_context="$RUNNER_TEMP/util-linux-trial-context"
          trial_output="$RUNNER_TEMP/util-linux-trial"
          mkdir -m 700 "$trial_output"
          git rev-parse HEAD > "$trial_output/tested-revision.txt"
          python3 "$candidate_source/prepare_trial.py" \
            --candidate-directory "$RUNNER_TEMP/util-linux-evaluation" \
            --context "$trial_context" --tested-revision "$(git rev-parse HEAD)"
          cp "$trial_context/context-manifest.json" "$trial_output/context-manifest.json"
          reference_id="$(cat "$RUNNER_TEMP/image-id.txt")"
          docker image inspect "$reference_id" > "$trial_output/reference-image.json"
          python3 - "$trial_output/reference-image.json" "$reference_id" <<'PY'
          import json, re, sys
          image = json.load(open(sys.argv[1]))[0]
          assert image['Id'] == sys.argv[2] and re.fullmatch(r'sha256:[a-f0-9]{64}', image['Id'])
          assert image['Os'] == 'linux' and image['Architecture'] == 'amd64'
          assert image['Config']['User'] == '10001:10001'
          PY
          docker tag "$reference_id" openid-util-linux-reference:ci
          assessment_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["buildAssessmentSHA256"])' "$trial_context/context-manifest.json")"
          docker build --network none --platform linux/amd64 --tag openid-util-linux-trial:ci \
            --build-arg BASE_IMAGE=openid-util-linux-reference:ci \
            --build-arg "BUILD_ASSESSMENT_SHA256=$assessment_sha" \
            --file "$trial_context/Dockerfile" "$trial_context" 2>&1 | tee "$trial_output/build.log"
          test "$(docker image inspect openid-util-linux-reference:ci --format '{{.Id}}')" = "$reference_id"
          docker image inspect openid-util-linux-trial:ci > "$trial_output/candidate-image.json"
          docker image inspect openid-util-linux-trial:ci --format '{{.Id}}' > "$trial_output/candidate-image-id.txt"
          PYTHONPATH="$candidate_source" python3 - "$trial_output" <<'PY'
          import json, sys
          from pathlib import Path
          from trial_install import check_image
          output = Path(sys.argv[1])
          reference = json.loads((output/'reference-image.json').read_text())[0]
          candidate = json.loads((output/'candidate-image.json').read_text())[0]
          binding = check_image(reference, candidate)
          (output/'image-binding.json').write_text(json.dumps(binding, indent=2)+'\n')
          PY
          timeout 30s docker run --rm --name openid-util-linux-report --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 32 --memory 128m --cpus 1 \
            --entrypoint python "$(cat "$trial_output/candidate-image-id.txt")" \
            -c 'from pathlib import Path; print(Path("/usr/share/doc/openid-util-linux-candidate/installation.json").read_text(), end="")' \
            > "$trial_output/installation.json"
      - name: Verify installed libraries and rerun application and protocol tests
        id: util_linux_trial_tests
        if: ${{ success() && steps.util_linux_trial.outcome == 'success' }}
        timeout-minutes: 7
        run: |
          set -euo pipefail
          candidate_source="$RUNNER_TEMP/image-source/deployment/build/util_linux"
          trial_output="$RUNNER_TEMP/util-linux-trial"
          candidate_id="$(cat "$trial_output/candidate-image-id.txt")"
          assessment_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["buildAssessmentSHA256"])' "$trial_output/context-manifest.json")"
          timeout 120s docker run --rm --name openid-util-linux-probe --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 32 --memory 256m --cpus 1 \
            -v "$candidate_source:/checks:ro" --entrypoint python "$candidate_id" /checks/probe_trial.py \
            --image-id "$candidate_id" --revision "$(git rev-parse HEAD)" --assessment-sha256 "$assessment_sha" \
            > "$trial_output/runtime-probe.json"
          timeout 120s docker run --rm --name openid-util-linux-privileges --network none --read-only \
            --cap-drop ALL --cap-add DAC_READ_SEARCH --user 0:0 --security-opt no-new-privileges \
            --pids-limit 32 --memory 128m --cpus 1 \
            -v "$RUNNER_TEMP/image-source/deployment/build/file_privileges.py:/checks/file_privileges.py:ro" \
            --entrypoint python "$candidate_id" -B /checks/file_privileges.py check \
            --image-id "$candidate_id" --revision "$(git rev-parse HEAD)" > "$trial_output/file-privileges.json"
          timeout 120s docker run --rm --name openid-util-linux-surface --network none --read-only \
            --cap-drop ALL --cap-add DAC_READ_SEARCH --user 0:0 --security-opt no-new-privileges \
            --pids-limit 32 --memory 128m --cpus 1 \
            -v "$RUNNER_TEMP/image-source/deployment/build/image_surface.py:/checks/image_surface.py:ro" \
            --entrypoint python "$candidate_id" -B /checks/image_surface.py \
            --whole-image --image-id "$candidate_id" --revision "$(git rev-parse HEAD)" \
            > "$trial_output/image-surface-root.json"
          timeout 180s docker run --rm --name openid-util-linux-image-tests --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 2g --cpus 2 \
            --tmpfs /tmp:size=256m,mode=1777 -e PYTHONPATH=/app/verification \
            -v "$RUNNER_TEMP/image-source/verification/test_verification.py:/app/verification/test_verification.py:ro" \
            -v "$RUNNER_TEMP/image-source/verification/test_image_input.py:/app/verification/test_image_input.py:ro" \
            -v "$RUNNER_TEMP/image-source/verification/test_bounded_process.py:/app/verification/test_bounded_process.py:ro" \
            -v "$RUNNER_TEMP/image-source/verification/test_profile_worker.py:/app/verification/test_profile_worker.py:ro" \
            -v "$RUNNER_TEMP/image-source/verification/test_worker_confinement.py:/app/verification/test_worker_confinement.py:ro" \
            --entrypoint python "$candidate_id" \
            -m unittest -v test_verification.FaceTests test_image_input test_bounded_process test_profile_worker test_worker_confinement \
            2>&1 | tee "$trial_output/image-tests.log"
          timeout 180s docker run --rm --name openid-util-linux-security-tests --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 2g --cpus 2 \
            --tmpfs /tmp:size=256m,mode=1777 -e PYTHONPATH=/tests:/app/verification \
            -v "$RUNNER_TEMP/protocol-tests:/tests:ro" --entrypoint python "$candidate_id" \
            -m unittest -v test_wallet test_runtime test_recovery_operations test_recovery_binding test_passport_revocation test_ingress_client test_crl_maintenance.MaintenanceTests test_sqlite_retention test_audit_archive \
            2>&1 | tee "$trial_output/security-tests.log"
          mkdir "$trial_output/protocol"
          timeout 180s docker run --rm --name openid-util-linux-protocol --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 2g --cpus 2 \
            --user "$(id -u):$(id -g)" --tmpfs /tmp:size=256m,mode=1777 \
            --sysctl net.ipv4.ip_unprivileged_port_start=0 \
            --add-host idp.example.test:127.0.0.1 --add-host sp.example.test:127.0.0.1 \
            -e PYTHONPATH=/tests:/app/verification -v "$RUNNER_TEMP/protocol-tests:/tests:ro" \
            -v "$trial_output/protocol:/evidence" --entrypoint python "$candidate_id" \
            /tests/protocol_evidence.py --output /evidence/protocol-results.json \
            2>&1 | tee "$trial_output/protocol-tests.log"
      - name: Build and compare restricted OpenCV candidate without changing the release image
        run: |
          docker build --platform linux/amd64 --target opencv-candidate --tag openid-opencv:ci --file "$RUNNER_TEMP/image-source/deployment/Dockerfile" "$RUNNER_TEMP/image-source"
          mkdir "$RUNNER_TEMP/opencv-evaluation"
          native_container=$(docker create --entrypoint true openid-opencv:ci)
          docker cp "$native_container:/opt/openid-opencv/evidence" "$RUNNER_TEMP/opencv-evaluation/native"
          docker rm "$native_container"
          for kind in reference candidate; do
            image=openid-pilot:ci
            if [ "$kind" = candidate ]; then image=openid-opencv:ci; fi
            docker image inspect "$image" --format '{{.Id}}' > "$RUNNER_TEMP/opencv-evaluation/$kind-image-id.txt"
            if [ "$kind" = candidate ]; then
              timeout 120s docker run --rm --network none --read-only --cap-drop ALL --cap-add DAC_READ_SEARCH --user 0:0 \
                --security-opt no-new-privileges --pids-limit 32 --memory 128m --cpus 1 \
                -v "$PWD/deployment/build/file_privileges.py:/checks/file_privileges.py:ro" \
                --entrypoint python "$(cat "$RUNNER_TEMP/opencv-evaluation/$kind-image-id.txt")" -B /checks/file_privileges.py check \
                --image-id "$(cat "$RUNNER_TEMP/opencv-evaluation/$kind-image-id.txt")" --revision "$(git rev-parse HEAD)" \
                > "$RUNNER_TEMP/opencv-evaluation/candidate-file-privileges.json"
              docker run --rm --network none --read-only --cap-drop ALL \
                --security-opt no-new-privileges --pids-limit 128 --memory 2g --cpus 2 \
                --tmpfs /tmp:size=128m,mode=1777 \
                -v "$PWD/verification/test_worker_confinement.py:/app/verification/test_worker_confinement.py:ro" \
                --entrypoint python "$image" -m unittest -v test_worker_confinement.LinuxConfinementTests
            fi
            docker run --rm --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges --pids-limit 128 --memory 2g --cpus 2 \
              --user "$(id -u):$(id -g)" --tmpfs /tmp:size=128m,mode=1777 \
              -v "$PWD/deployment/build/opencv/probe.py:/checks/probe.py:ro" \
              -v "$RUNNER_TEMP/opencv-evaluation:/evidence" \
              --entrypoint python "$image" /checks/probe.py "$kind" /evidence
          done
          git rev-parse HEAD > "$RUNNER_TEMP/opencv-evaluation/tested-revision.txt"
          python3 deployment/build/opencv/compare.py "$RUNNER_TEMP/opencv-evaluation"
      - name: Audit every installed Debian package in the built image
        run: |
          python3 .github/scripts/audit_image_os.py \
            --image "$(cat "$RUNNER_TEMP/image-id.txt")" \
            --output "$RUNNER_TEMP/image-os-audit"
      - name: Audit installed candidate packages without waiving findings
        if: ${{ !cancelled() && steps.util_linux_trial.outcome == 'success' }}
        run: |
          python3 .github/scripts/audit_image_os.py \
            --image "$(cat "$RUNNER_TEMP/util-linux-trial/candidate-image-id.txt")" \
            --output "$RUNNER_TEMP/util-linux-trial/os-audit"
      - name: Stop trial processes before retaining evidence
        if: always()
        run: |
          docker rm --force openid-util-linux-report openid-util-linux-probe openid-util-linux-privileges \
            openid-util-linux-surface openid-util-linux-image-tests openid-util-linux-security-tests openid-util-linux-protocol \
            >/dev/null 2>&1 || true
      - name: Save util-linux installation and runtime evidence including failures
        if: ${{ always() && steps.util_linux_trial.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: util-linux-installation-evidence
          path: '${{ runner.temp }}/util-linux-trial/'
          if-no-files-found: error
          retention-days: 30
      - name: Save image package inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pilot-image-inventory
          path: |
            ${{ runner.temp }}/python-packages.json
            ${{ runner.temp }}/image-id.txt
            ${{ runner.temp }}/image-surface.json
            ${{ runner.temp }}/image-surface-root.json
            ${{ runner.temp }}/file-privileges.json
            ${{ runner.temp }}/runtime-versions.txt
            ${{ runner.temp }}/runtime-components.json
            ${{ runner.temp }}/sqlite-transition.json
            ${{ runner.temp }}/python-runtime-evidence
            ${{ runner.temp }}/temurin-upstream-sbom.cdx.json
            ${{ runner.temp }}/image-os-audit/
            ${{ runner.temp }}/opencv-evaluation/
          if-no-files-found: error
          retention-days: 90
      - name: Logs and cleanup
        if: always()
        run: |
          docker logs openid-pilot || true
          docker logs openid-rp || true
          docker rm --force openid-pilot openid-rp openid-image-surface openid-image-surface-root || true
      - name: Build and probe the authenticated ACL candidate without installing it
        id: acl_candidate
        if: ${{ !cancelled() && steps.util_linux_inputs.outcome == 'success' && steps.source_export.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          candidate_context="$RUNNER_TEMP/image-source/deployment/build"
          candidate_output="$RUNNER_TEMP/acl-evaluation"
          mkdir -m 700 "$candidate_output"
          git rev-parse HEAD > "$candidate_output/tested-revision.txt"
          python3 "$candidate_context/acl/candidate.py" fetch --directory "$RUNNER_TEMP/acl-inputs" 2>&1 | tee "$candidate_output/fetch.log"
          timeout 300s docker build --platform linux/amd64 --tag openid-acl-builder:ci \
            --build-arg "BUILDER_UID=$(id -u)" --build-arg "BUILDER_GID=$(id -g)" \
            --file "$candidate_context/acl/Dockerfile" "$candidate_context" 2>&1 | tee "$candidate_output/builder.log"
          timeout 240s docker run --rm --name openid-acl-candidate --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 \
            --memory 1g --cpus 2 --tmpfs /tmp:size=128m,mode=1777 \
            -v "$RUNNER_TEMP/acl-inputs:/inputs:ro" \
            -v "$candidate_output:/output" openid-acl-builder:ci 2>&1 | tee "$candidate_output/runner.log"
      - name: Stop any remaining ACL candidate before saving evidence
        if: always()
        run: docker rm --force openid-acl-candidate >/dev/null 2>&1 || true
      - name: Save ACL build and compatibility evidence including failures
        if: ${{ always() && steps.acl_candidate.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: acl-build-candidate
          path: |
            ${{ runner.temp }}/acl-evaluation/*.log
            ${{ runner.temp }}/acl-evaluation/tested-revision.txt
            ${{ runner.temp }}/acl-evaluation/evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Package the tested image and provenance
        run: |
          python3 deployment/image_bundle.py package --image openid-pilot:ci \
            --protocol "$RUNNER_TEMP/protocol-evidence/protocol-results.json" \
            --inventory "$RUNNER_TEMP/python-packages.json" \
            --output "$RUNNER_TEMP/image-bundle"
      - name: Verify export and reload without rebuilding
        run: |
          revision="$(git rev-parse HEAD)"
          manifest_sha="$(sha256sum "$RUNNER_TEMP/image-bundle/manifest.json" | cut -d ' ' -f 1)"
          docker image rm "openid-pilot:commit-$revision" openid-pilot:ci
          sudo python3 deployment/image_bundle.py import --directory "$RUNNER_TEMP/image-bundle" \
            --expected-revision "$revision" --expected-manifest-sha256 "$manifest_sha"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --entrypoint java \
            "openid-pilot:commit-$revision" -version
      - name: Retain deployable image after main push or manual build
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pilot-image-${{ github.sha }}
          path: '${{ runner.temp }}/image-bundle'
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
  ncurses_candidate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ncurses_candidate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Reject malformed source and package evidence
        run: |
          python3 -m unittest discover -s deployment/build/util_linux -p 'test_*.py' -v
          python3 -m unittest discover -s deployment/build/ncurses -p 'test_*.py' -v
      - name: Export tracked source only
        run: |
          mkdir "$RUNNER_TEMP/ncurses-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/ncurses-source"
      - name: Build and probe the authenticated ncurses candidate
        id: build
        run: |
          set -euo pipefail
          candidate_context="$RUNNER_TEMP/ncurses-source/deployment/build"
          candidate_output="$RUNNER_TEMP/ncurses-evaluation"
          mkdir -m 700 "$candidate_output"
          git rev-parse HEAD > "$candidate_output/tested-revision.txt"
          python3 "$candidate_context/ncurses/candidate.py" fetch --directory "$RUNNER_TEMP/ncurses-inputs" 2>&1 | tee "$candidate_output/fetch.log"
          timeout 600s docker build --platform linux/amd64 --tag openid-ncurses-builder:ci \
            --build-arg "BUILDER_UID=$(id -u)" --build-arg "BUILDER_GID=$(id -g)" \
            --file "$candidate_context/ncurses/Dockerfile" "$candidate_context" 2>&1 | tee "$candidate_output/builder.log"
          timeout 720s docker run --rm --name openid-ncurses-candidate --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 512 \
            --memory 4g --cpus 2 --tmpfs /tmp:size=256m,mode=1777 \
            -v "$RUNNER_TEMP/ncurses-inputs:/inputs:ro" \
            -v "$candidate_output:/output" openid-ncurses-builder:ci 2>&1 | tee "$candidate_output/runner.log"
      - name: Stop any remaining ncurses process
        if: always()
        run: docker rm --force openid-ncurses-candidate >/dev/null 2>&1 || true
      - name: Save ncurses build and compatibility evidence including failures
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ncurses-build-candidate
          path: |
            ${{ runner.temp }}/ncurses-evaluation/*.log
            ${{ runner.temp }}/ncurses-evaluation/tested-revision.txt
            ${{ runner.temp }}/ncurses-evaluation/evidence/
          if-no-files-found: error
          retention-days: 30
