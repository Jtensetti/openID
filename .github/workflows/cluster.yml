name: Shared registry and key service
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: openid_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d openid_test" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Install locked dependencies and key service
        run: |
          python3.12 -m venv verification/.venv
          verification/.venv/bin/pip install --require-hashes --only-binary=:all: -r verification/cluster-requirements.lock -r verification/runtime-requirements.lock -r verification/rp-requirements.lock
          sed -n '/^numpy==/p; /^opencv-python-headless==/p' verification/requirements.lock > "$RUNNER_TEMP/image-requirements.lock"
          verification/.venv/bin/pip install --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/image-requirements.lock"
          curl --fail --location --retry 3 'https://github.com/openbao/openbao/releases/download/v2.7.1/openbao_2.7.1_linux_amd64.tar.gz' --output "$RUNNER_TEMP/bao.tar.gz"
          printf '%s  %s\n' '0e2f1ce10d124e03112b50dd2fbec6b78003783253bc3a91587938f39d1e2243' "$RUNNER_TEMP/bao.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/bao"
          tar -xzf "$RUNNER_TEMP/bao.tar.gz" -C "$RUNNER_TEMP/bao"
      - name: Build authentication image without biometric models
        id: registry_image
        run: |
          docker build --tag openid-wallet:ci --file deployment/cluster/Dockerfile .
          image_id=$(docker image inspect openid-wallet:ci --format '{{.Id}}')
          printf 'image_id=%s\n' "$image_id" >> "$GITHUB_OUTPUT"
          timeout 120s docker run --rm --network none --read-only --cap-drop ALL --cap-add DAC_READ_SEARCH --user 0:0 \
            --security-opt no-new-privileges --pids-limit 32 --memory 128m --cpus 1 \
            -v "$PWD/deployment/build/file_privileges.py:/checks/file_privileges.py:ro" \
            --entrypoint python "$image_id" -B /checks/file_privileges.py check \
            --image-id "$image_id" --revision "$(git rev-parse HEAD)" \
            > "$RUNNER_TEMP/cluster-file-privileges.json"
          timeout 120s docker run --rm --name openid-registry-surface --network none --read-only \
            --cap-drop ALL --cap-add DAC_READ_SEARCH --user 0:0 --security-opt no-new-privileges \
            --pids-limit 32 --memory 128m --cpus 1 \
            -v "$PWD/deployment/build/image_surface.py:/checks/image_surface.py:ro" \
            --entrypoint python "$image_id" -B /checks/image_surface.py \
            --whole-image --image-id "$image_id" --revision "$(git rev-parse HEAD)" \
            > "$RUNNER_TEMP/cluster-image-surface.json"
          docker run --rm -i --network none --read-only --cap-drop ALL --entrypoint python openid-wallet:ci - < deployment/build/python_inventory.py > "$RUNNER_TEMP/cluster-python-packages.json"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 32 --memory 256m --cpus 1 \
            --user "$(id -u):$(id -g)" --tmpfs /tmp:size=32m,mode=1777 \
            -e PYTHONPATH=/tests:/app/verification \
            -v "$PWD/verification/test_cluster_revocation.py:/tests/test_cluster_revocation.py:ro" \
            -v "$PWD/verification/test_enrollment_policy.py:/tests/test_enrollment_policy.py:ro" \
            --entrypoint python openid-wallet:ci -m unittest -v test_cluster_revocation
          docker run --rm --read-only --cap-drop ALL --entrypoint python openid-wallet:ci cluster_recovery.py --help
          docker run --rm --read-only --cap-drop ALL --entrypoint python openid-wallet:ci subject_erasure.py --help
          docker run --rm --read-only --cap-drop ALL --entrypoint python openid-wallet:ci audit_archive.py --help
      - name: Enable and verify database TLS
        env:
          POSTGRES_CONTAINER: '${{ job.services.postgres.id }}'
        run: bash .github/scripts/postgres-tls.sh
      - name: Use a database owner without PostgreSQL superuser privileges
        env:
          POSTGRES_CONTAINER: '${{ job.services.postgres.id }}'
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d openid_test -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE test_bootstrap LOGIN NOSUPERUSER NOBYPASSRLS CREATEDB CREATEROLE PASSWORD 'disposable-bootstrap-password'" \
            -c 'ALTER DATABASE openid_test OWNER TO test_bootstrap'
      - name: Test database roles, concurrent operations and real Transit cryptography
        working-directory: verification
        env:
          OPENID_TEST_POSTGRES: 'host=127.0.0.1 port=5432 dbname=openid_test user=test_bootstrap password=disposable-bootstrap-password sslmode=verify-full sslrootcert=${{ runner.temp }}/postgres.crt'
          OPENID_TEST_BAO: '${{ runner.temp }}/bao/bao'
          OPENID_TEST_CONTAINER: openid-wallet:ci
          OPENID_TEST_REPORT: '${{ runner.temp }}/cluster-capacity.json'
          OPENID_TEST_SOAK_SECONDS: '120'
        run: |
          .venv/bin/python test_cluster.py -v
          .venv/bin/python -m unittest test_operations -v
          .venv/bin/python -m unittest test_key_recovery -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cluster-capacity
          path: |
            ${{ runner.temp }}/cluster-capacity.json
            ${{ runner.temp }}/cluster-python-packages.json
            ${{ runner.temp }}/cluster-file-privileges.json
            ${{ runner.temp }}/cluster-image-surface.json
          retention-days: 14
      - name: Audit every installed Debian package in the registry image
        if: ${{ !cancelled() && steps.registry_image.outputs.image_id != '' }}
        timeout-minutes: 10
        env:
          IMAGE_ID: ${{ steps.registry_image.outputs.image_id }}
        run: |
          python3 .github/scripts/audit_image_os.py \
            --image "$IMAGE_ID" \
            --output "$RUNNER_TEMP/cluster-os-audit"
      - name: Save registry OS assessment including failures
        if: ${{ always() && steps.registry_image.outputs.image_id != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cluster-os-inventory
          path: ${{ runner.temp }}/cluster-os-audit/
          if-no-files-found: error
          retention-days: 90
      - name: Stop any remaining component inspector
        if: always()
        run: docker rm --force openid-registry-surface >/dev/null 2>&1 || true
