name: Shared registry and key service
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: openid_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres -d openid_test" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.19.0'
      - name: Install locked dependencies and key service
        run: |
          python3.12 -m venv verification/.venv
          verification/.venv/bin/pip install --require-hashes --only-binary=:all: -r verification/cluster-requirements.lock -r verification/runtime-requirements.lock -r verification/rp-requirements.lock
          sed -n '/^numpy==/p; /^opencv-python-headless==/p' verification/requirements.lock > "$RUNNER_TEMP/image-requirements.lock"
          verification/.venv/bin/pip install --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/image-requirements.lock"
          curl --fail --location --retry 3 'https://github.com/openbao/openbao/releases/download/v2.7.1/openbao_2.7.1_linux_amd64.tar.gz' --output "$RUNNER_TEMP/bao.tar.gz"
          printf '%s  %s\n' '0e2f1ce10d124e03112b50dd2fbec6b78003783253bc3a91587938f39d1e2243' "$RUNNER_TEMP/bao.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/bao"
          tar -xzf "$RUNNER_TEMP/bao.tar.gz" -C "$RUNNER_TEMP/bao"
      - name: Build authentication image without biometric models
        run: |
          docker build --tag openid-wallet:ci --file deployment/cluster/Dockerfile .
          docker run --rm --read-only --cap-drop ALL --entrypoint python openid-wallet:ci cluster_recovery.py --help
      - name: Enable and verify database TLS
        env:
          POSTGRES_CONTAINER: '${{ job.services.postgres.id }}'
        run: bash .github/scripts/postgres-tls.sh
      - name: Use a database owner without PostgreSQL superuser privileges
        env:
          POSTGRES_CONTAINER: '${{ job.services.postgres.id }}'
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d openid_test -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE test_bootstrap LOGIN NOSUPERUSER NOBYPASSRLS CREATEDB CREATEROLE PASSWORD 'disposable-bootstrap-password'" \
            -c 'ALTER DATABASE openid_test OWNER TO test_bootstrap'
      - name: Test database roles, concurrent operations and real Transit cryptography
        working-directory: verification
        env:
          OPENID_TEST_POSTGRES: 'host=127.0.0.1 port=5432 dbname=openid_test user=test_bootstrap password=disposable-bootstrap-password sslmode=verify-full sslrootcert=${{ runner.temp }}/postgres.crt'
          OPENID_TEST_BAO: '${{ runner.temp }}/bao/bao'
          OPENID_TEST_CONTAINER: openid-wallet:ci
          OPENID_TEST_REPORT: '${{ runner.temp }}/cluster-capacity.json'
          OPENID_TEST_SOAK_SECONDS: '120'
        run: |
          .venv/bin/python test_cluster.py -v
          .venv/bin/python -m unittest test_operations -v
          .venv/bin/python -m unittest test_key_recovery -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cluster-capacity
          path: '${{ runner.temp }}/cluster-capacity.json'
          retention-days: 14
