name: Retire consolidated branches

on:
  push:
    branches: [main]
    paths: [.github/workflows/retire-branches.yml]

permissions:
  contents: write

jobs:
  retire:
    if: github.repository == 'Jtensetti/openID' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Remove unchanged branches preserved in main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, subprocess, urllib.request, urllib.error
          from urllib.parse import quote
          expected = json.loads("{\"chore/repository-cleanup\":\"eae6cd6c2ca57ac8a914cdaac48d277af75217cb\",\"chore/swedish-copy-cleanup\":\"611101e98e247e446bab38b405edd9b35a0a2036\",\"claude/signering-testkonsol-biometri\":\"c91102b581c5eb0523c85012a0f03eb3ece74a22\",\"codex/always-on-revocation\":\"101b0ff666a714aa07136082efa67935bc149ce0\",\"codex/assurance-gap-20261026\":\"407f03dee647cae28ef122ab47a3b4790a9248d2\",\"codex/beta-client-rate-limit\":\"da0b5ea50b55555000fbdf67034ea3b7d195269e\",\"codex/beta-hours-november\":\"c95cef7e78b0df3ea0b001fee5002e5f111398ba\",\"codex/digg-readiness-project-page\":\"d2e06a79f98f246d2527f2b64c65a23a7b01d995\",\"codex/digg-requirements-controls\":\"1cb0d93e7597dcbd03a50c136d6e1b14ae0723e5\",\"codex/image-os-advisories\":\"a6d9dbb8a0d4ba7d4395c0bc919cfc64e74fc4c9\",\"codex/insights-verified-fixes-20261101\":\"e0bf43e1b3fd6a3734f2d88f40a0418b7275be0c\",\"codex/integrations-and-cleanup-20261105\":\"85000d9b78070ca8239bfd77306a2666248e0f17\",\"codex/iphone-pilot-oidc-testflight\":\"4ae916b80c82f0fc51f610b37d0d7abbc2e41744\",\"codex/isolated-build-delivery\":\"d18efa9a0dc81405f0edf91c0f9f5ced3276dcd8\",\"codex/public-test-access\":\"c5d67cfd0d3d6068a59b95082c438602ba812e86\",\"codex/readiness-and-verification-efficiency\":\"3d7d481e13fe138205f77fc3cee7da006cc34ac1\",\"codex/registry-binding-recovery\":\"f7d018f2232db47f729ffb39c37c2b6ba54c4ba0\",\"codex/release-candidate-20261026\":\"e5425d781778484cf23a3d8f4d1cfd74fcf0aa13\",\"codex/repo-refresh-20261030\":\"fb1cbd4ddbc1a2e66b2d430e8bef8033ee760e0a\",\"codex/required-passport-revocation\":\"e96d9b46cf8bd5289881c93e1fafad6655eee69a\",\"codex/runtime-maintenance-20261030\":\"569ac37de2a11250301aa9fd879b64c69ddb475d\",\"codex/security-consolidation-20261030\":\"877e384b325e5d28e249557a301454ffd4a261e5\",\"codex/security-foundation\":\"32964b9f74406ae9a528cd6e698e17b1374d9ba1\",\"codex/security-integration\":\"f020fb25b97e8d65a905a6a5d1ae34479e093efd\",\"codex/security-operations\":