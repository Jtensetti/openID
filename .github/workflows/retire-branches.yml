":\"0005c2eff706b9d29a0228a6778328d50e659bf2\",\"feat/aws-budget-validation\":\"9248da5b8b95326948dc355f37c4b9dcfeb0b393\",\"feat/backend-runtime\":\"673a82b72ef755a394ecf672b5b0af2b50041153\",\"feat/g1-isolated-saml-prototype\":\"b74906fa5e24cdbfe7cdab5fc85b7b379bf83ca9\",\"feat/g2-durable-state-and-operations\":\"8c19185505994ad239fc92ccfa8ec2f97d0e9528\",\"feat/g2-open-web-authentication\":\"9604c69ea0c368b841946b8d2bb68827520eddc8\",\"feat/g3-passport-biometric-verification\":\"7700e273e30e35477237e227765e7489c2e052fb\",\"feat/g4-complete-ios-app\":\"638d5449be80f11d30c4d1e6eefa2e5f81c1b4fb\",\"feat/g5-local-rp-web\":\"61ec86d37c79e0c59ed2b540e2c9462812c414da\",\"feat/g6-copy-cleanup\":\"f17e7f1de311cda1de8f5e4725acf71e82333258\",\"feat/g7-identity-federation\":\"246118bbd3dc754ad075852037248a011c4510ab\",\"feat/guided-selfie-capture\":\"597d776eae105cfcc9d6cd411b005c1635d413c2\",\"feat/server-chip-authentication\":\"00cb348d7717468ba7a860ef22afff3f79a8c0ed\",\"feature/sandbox-saml-certs-metadata-preflight\":\"e13bca4fe5d1c43eb954460e9200f320894ae56e\",\"feature/sweden-connect-sandbox-20261102\":\"2e4d8c9ef1784022559600a84487259e71a0666c\",\"feature/tjipp-app-sandbox\":\"0ed9630eb46860f0d14517fa3af201139117738b\",\"fix/assurance-remediation\":\"51643918f4d2afe8b2830b392eaabbcabc2237e9\",\"fix/audit-archive\":\"22c62718a6ff4dd0373d9a12037a102f16518eab\",\"fix/sweden-connect-sandbox-validation\":\"8843133c1636c2e4800558306b212fe4457b9097\",\"release/beta112-base\":\"f2f3db64a6eec3b85a33aab9949b1c569eeaefc4\",\"security/beta112-identity-isolation\":\"87b9bad69d14293aa35ee284c022d04bf2240e5c\",\"security/beta112-live-isolation\":\"fb730e094880389a1fe6c72105e66de7ae7c1f12\",\"test/sandbox-attributes-20261106\":\"533a634b7f5b1c7fce8b980557806ab035eaf91b\",\"consolidation/20261108\":\"dd08cb09abf028e018ce959c7eb0641c7d37d41d\"}")
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          def api(path, method="GET"):
              req = urllib.request.Request("https://api.github.com/repos/" + repo + "/" + path, method=method,
                  headers={"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read()
                  return json.loads(body) if body else None
          for branch, sha in expected.items():
              if branch == "main":
                  raise SystemExit("Refusing default branch")
              subprocess.run(["git", "merge-base", "--is-ancestor", sha, "HEAD"], check=True)
          retired = []
          for branch, sha in expected.items():
              path = "git/refs/heads/" + quote(branch, safe="/")
              try:
                  current = api(path)["object"]["sha"]
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      continue
                  raise
              if current != sha:
                  raise SystemExit("Branch changed: " + branch)
              api(path, "DELETE")
              retired.append(branch)
              print("Retired " + branch)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as report:
              report.write(str(len(retired)) + " branches removed. All recorded tips are ancestors of main.\\n")
          
